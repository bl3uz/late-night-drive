<script>
/* ============================ setup ============================ */
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });
const spSlot = document.getElementById('spSlot');
const spFrame = document.getElementById('spFrame');
const fileInput = document.getElementById('fileInput');

let W = 480, H = 270;
const L = {};

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rad = d => d * Math.PI / 180;

const S = {
  t: 0,
  scroll: 0,
  speed: 18,
  speedKmh: 84,
  wiperMode: 1,
  wiperToast: 0,
  rain: 0.55,
  vol: 0.70,
  carEq: true,
  mode: 'local',
  playing: false,
  wash: 0
};

const SPOTIFY_SRC = "https://open.spotify.com/embed/playlist/29dbwulOAfH8c8ZxvvLXs6?utm_source=generator&theme=0";

/* ============================ pixel font ============================ */
const FONT = {
  '0':'111,101,101,101,111','1':'010,110,010,010,111','2':'111,001,111,100,111',
  '3':'111,001,111,001,111','4':'101,101,111,001,001','5':'111,100,111,001,111',
  '6':'111,100,111,101,111','7':'111,001,010,010,010','8':'111,101,111,101,111',
  '9':'111,101,111,001,111',
  'A':'010,101,111,101,101','B':'110,101,110,101,110','C':'011,100,100,100,011',
  'D':'110,101,101,101,110','E':'111,100,110,100,111','F':'111,100,110,100,100',
  'G':'011,100,101,101,011','H':'101,101,111,101,101','I':'111,010,010,010,111',
  'J':'001,001,001,101,010','K':'101,101,110,101,101','L':'100,100,100,100,111',
  'M':'101,111,111,101,101','N':'101,111,111,111,101','O':'010,101,101,101,010',
  'P':'110,101,110,100,100','Q':'010,101,101,111,011','R':'110,101,110,101,101',
  'S':'011,100,010,001,110','T':'111,010,010,010,010','U':'101,101,101,101,111',
  'V':'101,101,101,101,010','W':'101,101,111,111,101','X':'101,101,010,101,101',
  'Y':'101,101,010,010,010','Z':'111,001,010,100,111',
  ':':'000,010,000,010,000','.':'000,000,000,000,010','-':'000,000,111,000,000',
  '/':'001,001,010,100,100',' ':'000,000,000,000,000','+':'000,010,111,010,000',
  '<':'001,010,100,010,001','>':'100,010,001,010,100','*':'101,010,101,000,000',
  '%':'101,001,010,100,101','|':'010,010,010,010,010'
};

function pixText(str, x, y, scale, color) {
  ctx.fillStyle = color;
  let cx = Math.round(x);
  const s = Math.max(1, Math.round(scale));
  for (const ch of String(str).toUpperCase()) {
    const g = FONT[ch];
    if (g) {
      const rows = g.split(',');
      for (let r = 0; r < rows.length; r++) {
        for (let c = 0; c < 3; c++) {
          if (rows[r][c] === '1') ctx.fillRect(cx + c * s, Math.round(y) + r * s, s, s);
        }
      }
    }
    cx += 4 * s;
  }
  return cx;
}

function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
}

function poly(points, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(Math.round(points[0][0]), Math.round(points[0][1]));
  for (let i = 1; i < points.length; i++) ctx.lineTo(Math.round(points[i][0]), Math.round(points[i][1]));
  ctx.closePath();
  ctx.fill();
}

function pixCircle(cx, cy, r, color) {
  ctx.fillStyle = color;
  cx = Math.round(cx); cy = Math.round(cy);
  for (let y = -r; y <= r; y++) {
    const w = Math.floor(Math.sqrt(Math.max(0, r * r - y * y)));
    ctx.fillRect(cx - w, cy + y, w * 2 + 1, 1);
  }
}

function radial(x, y, r, rgb, a) {
  if (r <= 0.5 || a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')');
  g.addColorStop(0.35, 'rgba(' + rgb + ',' + (a * 0.45) + ')');
  g.addColorStop(0.7, 'rgba(' + rgb + ',' + (a * 0.14) + ')');
  g.addColorStop(1, 'rgba(' + rgb + ',0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function ellipseRing(cx, cy, rx, ry, thick, color) {
  ctx.fillStyle = color;
  for (let y = -ry; y <= ry; y++) {
    const t = y / ry;
    const half = rx * Math.sqrt(Math.max(0, 1 - t * t));
    const ryi = ry - thick;
    const rxi = rx - thick;
    let inner = 0;
    if (ryi > 0 && Math.abs(y) < ryi) {
      const t2 = y / ryi;
      inner = rxi * Math.sqrt(Math.max(0, 1 - t2 * t2));
    }
    if (half - inner > 0.4) {
      const w = Math.round(half - inner);
      if (w < 1) continue;
      ctx.fillRect(Math.round(cx - half), Math.round(cy + y), w, 1);
      ctx.fillRect(Math.round(cx + inner), Math.round(cy + y), w, 1);
    }
  }
}

/* ============================ Audio Engine ============================ */
const localAudio = new Audio();
let localTracks = [];
let trackIndex = 0;
let marqueeOffset = 0;
let trackTitle = "LOAD MP3 FILES";

const AudioEngine = (function () {
  let actx = null, master = null, rainBus = null, sfxBus = null, cabinBus = null;
  let lp1 = null, bp2 = null, g3 = null, scrapeGain = null;
  let whiteBuf = null, pinkBuf = null, shortBuf = null;
  let plinkTimer = null;
  let started = false;
  let mediaAttached = false;
  let eqLow = null, eqMid = null, eqHigh = null;

  function noise(seconds, pink) {
    const len = Math.max(1, Math.floor(actx.sampleRate * seconds));
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    if (pink) {
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99886*b0 + w*0.0555; b1 = 0.99332*b1 + w*0.075;
        b2 = 0.969*b2 + w*0.153;    b3 = 0.8665*b3 + w*0.31;
        b4 = 0.55*b4 + w*0.532;     b5 = -0.7616*b5 - w*0.016;
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.536) * 0.11;
        b6 = w * 0.115;
      }
    } else {
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    return buf;
  }

  function loopSource(buf, rate) {
    const s = actx.createBufferSource();
    s.buffer = buf;
    s.loop = true;
    s.playbackRate.value = rate || 1;
    s.start();
    return s;
  }

  function init() {
    if (started) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();

    master = actx.createGain();
    master.gain.value = 0.85;
    master.connect(actx.destination);

    rainBus = actx.createGain();
    rainBus.gain.value = S.rain;
    rainBus.connect(master);

    sfxBus = actx.createGain();
    sfxBus.gain.value = 0.9;
    sfxBus.connect(master);

    cabinBus = actx.createGain();
    cabinBus.gain.value = 0.10;
    cabinBus.connect(master);

    whiteBuf = noise(3, false);
    pinkBuf = noise(3.5, true);
    shortBuf = noise(0.25, false);

    // Rain Layer 1
    const s1 = loopSource(pinkBuf, 0.82);
    lp1 = actx.createBiquadFilter();
    lp1.type = 'lowpass'; lp1.frequency.value = 340;
    s1.connect(lp1).connect(rainBus);

    // Rain Layer 2
    const s2 = loopSource(whiteBuf, 1.0);
    bp2 = actx.createBiquadFilter();
    bp2.type = 'bandpass'; bp2.frequency.value = 1450;
    s2.connect(bp2).connect(rainBus);

    // Wiper Scrape
    const s4 = loopSource(whiteBuf, 1.0);
    const bpw = actx.createBiquadFilter();
    bpw.type = 'bandpass'; bpw.frequency.value = 950;
    scrapeGain = actx.createGain(); scrapeGain.gain.value = 0;
    s4.connect(bpw).connect(scrapeGain).connect(sfxBus);

    // Engine Idle
    const engOsc = actx.createOscillator();
    engOsc.type = 'triangle'; engOsc.frequency.value = 58;
    const engLP = actx.createBiquadFilter();
    engLP.type = 'lowpass'; engLP.frequency.value = 135;
    engOsc.connect(engLP).connect(cabinBus);
    engOsc.start();

    // Road drone
    const roadNoise = loopSource(pinkBuf, 0.65);
    const roadLP = actx.createBiquadFilter();
    roadLP.type = 'lowpass'; roadLP.frequency.value = 210;
    const roadG = actx.createGain(); roadG.gain.value = 0.45;
    roadNoise.connect(roadLP).connect(roadG).connect(cabinBus);

    if (actx.state === 'suspended') actx.resume();
    started = true;
    schedulePlink();
  }

  function schedulePlink() {
    plinkTimer = setTimeout(() => {
      if (started && actx && actx.state === 'running' && S.rain > 0.05) {
        if (Math.random() < 0.3 + S.rain * 0.7) plink();
      }
      schedulePlink();
    }, 700 + Math.random() * 2800);
  }

  function plink() {
    const t = actx.currentTime;
    const o = actx.createOscillator();
    o.type = 'sine';
    const f = 700 + Math.random() * 1700;
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.09);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.022 + Math.random() * 0.03, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g).connect(rainBus);
    o.start(t);
    o.stop(t + 0.17);
  }

  function attachMedia() {
    if (mediaAttached || !actx) return;
    try {
      const src = actx.createMediaElementSource(localAudio);
      eqLow = actx.createBiquadFilter();
      eqLow.type = 'lowshelf'; eqLow.frequency.value = 135;
      eqMid = actx.createBiquadFilter();
      eqMid.type = 'peaking'; eqMid.frequency.value = 420;
      eqHigh = actx.createBiquadFilter();
      eqHigh.type = 'lowpass'; eqHigh.frequency.value = 8200;

      src.connect(eqLow).connect(eqMid).connect(eqHigh).connect(master);
      mediaAttached = true;
      setCarEq(S.carEq);
    } catch (e) {}
  }

  function setCarEq(on) {
    if (!mediaAttached) return;
    const t = actx.currentTime;
    eqLow.gain.setTargetAtTime(on ? 4.5 : 0, t, 0.08);
    eqMid.gain.setTargetAtTime(on ? -2.5 : 0, t, 0.08);
    eqHigh.frequency.setTargetAtTime(on ? 8200 : 22000, t, 0.08);
  }

  function click() {
    if (!started) return;
    const t = actx.currentTime;
    const n = actx.createBufferSource(); n.buffer = shortBuf;
    const g = actx.createGain(); g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    n.connect(g).connect(sfxBus);
    n.start(t); n.stop(t + 0.035);
  }

  function thump() {
    if (!started) return;
    const t = actx.currentTime;
    const o = actx.createOscillator();
    o.frequency.setValueAtTime(58, t);
    o.frequency.exponentialRampToValueAtTime(37, t + 0.16);
    const g = actx.createGain(); g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g).connect(sfxBus);
    o.start(t); o.stop(t + 0.25);
  }

  function setRain(v) {
    if (rainBus) rainBus.gain.setTargetAtTime(clamp(v, 0, 1), actx.currentTime, 0.1);
  }

  function setScrape(v) {
    if (scrapeGain) scrapeGain.gain.setTargetAtTime(clamp(v, 0, 1) * 0.06, actx.currentTime, 0.05);
  }

  return {
    init,
    unlock() { init(); attachMedia(); },
    click,
    thump,
    setRain,
    setScrape,
    setCarEq
  };
})();

/* ============================ layout ============================ */
const wipers = [
  { px: 0, py: 0, len: 0, a0: rad(134), a1: rad(14), angle: rad(134), pos: 0, prevAngle: rad(134) },
  { px: 0, py: 0, len: 0, a0: rad(140), a1: rad(18), angle: rad(140), pos: 0, prevAngle: rad(140) }
];

function layout() {
  L.horizon = Math.round(H * 0.44);
  L.wTop = Math.round(H * 0.062);
  L.wBottom = Math.round(H * 0.695);
  L.yB = Math.round(H * 0.755);
  L.vpX = Math.round(W * 0.30);
  L.laneW = Math.round(W * 0.20);
  L.pad = Math.round(W * 0.055);
  L.dashTop = Math.round(H * 0.668);

  wipers[0].px = Math.round(W * 0.34);
  wipers[0].py = Math.round(H * 0.815);
  wipers[0].len = Math.round(H * 0.44);

  wipers[1].px = Math.round(W * 0.705);
  wipers[1].py = Math.round(H * 0.80);
  wipers[1].len = Math.round(H * 0.61);

  L.mirrorCx = Math.round(W * 0.50);
  L.mirrorW = Math.round(W * 0.20);
  L.mirrorH = Math.round(H * 0.105);
  L.mirrorY = Math.round(H * 0.045);

  // In-dash retro stereo deck coordinates
  L.deckX = 78;
  L.deckY = 191;
  L.deckW = 202;
  L.deckH = 74;

  L.dialX = 49;
  L.dialY = 232;
  L.dialR = 18;
}

function windshieldPath() {
  const x0 = L.pad, x1 = W - L.pad, top = L.wTop, bot = L.wBottom;
  const slope = Math.round(W * 0.012);
  ctx.beginPath();
  ctx.moveTo(x0 + 10, top);
  ctx.lineTo(x1 - 10, top);
  ctx.quadraticCurveTo(x1, top + 1, x1 - slope, top + 14);
  ctx.lineTo(x1 - slope, bot - 6);
  ctx.quadraticCurveTo(x1 - slope, bot, x1 - slope - 8, bot);
  ctx.lineTo(x0 + slope + 8, bot);
  ctx.quadraticCurveTo(x0 + slope, bot, x0 + slope, bot - 6);
  ctx.lineTo(x0 + slope, top + 14);
  ctx.quadraticCurveTo(x0, top + 1, x0 + 10, top);
  ctx.closePath();
}

/* ============================ Buttons Definition ============================ */
const UI = {
  btnLocal:   { x: 82,  y: 205, w: 50, h: 16 },
  btnSpotify: { x: 82,  y: 224, w: 50, h: 16 },
  btnLoadMp3: { x: 82,  y: 243, w: 50, h: 16 },

let pressedBtn = null;
let isDraggingVol = false;

/* ============================ scene elements ============================ */
let clouds = [], skyline = [], roadBuildings = [], lights = [], cars = [], puddleGlints = [];
let rainFar = [], rainNear = [], drops = [], streaks = [];
const SIGN_COLORS = ['#ff2a6d', '#05d9e8', '#ffb457', '#ff6b4a', '#59e3cf'];

function makeBuildingWindows(cols, rows) {
  const win = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (Math.random() < 0.42) win.push({ c, r, warm: Math.random() < 0.65, seed: rand(0, 50) });
    }
  }
  return win;
}

function seedScene() {
  clouds = [];
  for (let i = 0; i < 8; i++) {
    clouds.push({ x: rand(-100, W + 40), y: rand(L.wTop, L.horizon * 0.55), w: rand(46, 150), h: rand(9, 26), a: rand(0.05, 0.16), spd: rand(0.4, 1.4) });
  }

  skyline = [];
  let bx = -24;
  while (bx < W + 20) {
    const bw = randi(10, 28);
    const bh = randi(8, Math.min(48, Math.round(L.horizon * 0.42)));
    const win = [];
    for (let wy = 3; wy < bh - 2; wy += 4) {
      for (let wx = 2; wx < bw - 2; wx += 4) {
        if (Math.random() < 0.28) win.push({ x: wx, y: wy, seed: rand(0, 100), warm: Math.random() < 0.7 });
      }
    }
    skyline.push({ x: bx, w: bw, h: bh, win, col: Math.random() < 0.5 ? '#090e16' : '#0b111a' });
    bx += bw + randi(1, 5);
  }

  roadBuildings = [];
  for (let i = 0; i < 10; i++) {
    const zBase = 2.5 + i * 7.2;
    roadBuildings.push({
      side: -1, z: zBase, depth: rand(3.2, 5.2), width: rand(0.9, 1.5), height: rand(1.8, 4.2),
      uInner: -0.78, col: Math.random() < 0.5 ? '#0b1018' : '#0d131d',
      signColor: SIGN_COLORS[i % SIGN_COLORS.length], hasSign: Math.random() < 0.85,
      signH: rand(0.45, 0.72), awning: Math.random() < 0.65, win: makeBuildingWindows(3, 5)
    });
    roadBuildings.push({
      side: 1, z: zBase + 3.0, depth: rand(3.2, 5.2), width: rand(1.0, 1.6), height: rand(1.8, 4.2),
      uInner: 3.78, col: Math.random() < 0.5 ? '#090d14' : '#0b1018',
      signColor: SIGN_COLORS[(i + 2) % SIGN_COLORS.length], hasSign: Math.random() < 0.8,
      signH: rand(0.45, 0.72), awning: Math.random() < 0.5, win: makeBuildingWindows(3, 5)
    });
  }

  lights = [];
  for (let i = 0; i < 7; i++) {
    lights.push({ u: -0.62, side: -1, z: 2.2 + i * 16, seed: rand(0, 6.28) });
    lights.push({ u: 1.5, side: 1, z: 9.0 + i * 16, seed: rand(0, 6.28) });
  }

  cars = [
    { u: 1.0, z: 7.2, baseZ: 7.2, type: 'companion', wob: rand(0, 6) },
    { u: 1.0, z: 26.0, speed: 6.5, type: 'same', wob: rand(0, 6) },
    { u: 2.0, z: 14.0, speed: 24.0, type: 'oncoming', wob: rand(0, 6) },
    { u: 3.0, z: 32.0, speed: 28.0, type: 'oncoming', wob: rand(0, 6) }
  ];

  puddleGlints = [];
  for (let i = 0; i < 50; i++) {
    puddleGlints.push({ z: rand(2.0, 42), u: rand(-0.45, 3.45), a: rand(0.04, 0.16), seed: rand(0, 100) });
  }

  rainFar = [];
  for (let i = 0; i < Math.round(W * 0.44); i++) {
    rainFar.push({ x: rand(0, W), y: rand(0, H), len: rand(2.5, 6), v: rand(120, 210), a: rand(0.05, 0.16) });
  }
  rainNear = [];
  for (let i = 0; i < Math.round(W * 0.22); i++) {
    rainNear.push({ x: rand(0, W), y: rand(0, H), len: rand(7, 15), v: rand(280, 430), a: rand(0.10, 0.30) });
  }

  streaks = [];
  for (let i = 0; i < 11; i++) {
    streaks.push({ x: rand(0, W), y: rand(L.wTop, L.wBottom), len: rand(20, 70), a: rand(0.02, 0.06), spd: rand(2, 9) });
  }

  drops = [];
  for (let i = 0; i < Math.round(W / 5.2); i++) {
    const d = {};
    resetDrop(d, false);
    d.y = rand(L.wTop + 4, L.wBottom - 6);
    if (i < 10) { d.r = rand(2.6, 3.6); d.v = rand(1.2, 5); d.a = rand(0.45, 0.75); d.trail = rand(2, 7); }
    drops.push(d);
  }
}

function resetDrop(d, fromTop) {
  d.x = rand(L.pad + 12, W - L.pad - 12);
  d.y = fromTop ? rand(L.wTop - 14, L.wTop + 2) : rand(L.wTop, L.wBottom);
  d.r = rand(0.8, 3.2);
  d.v = rand(6, 30) * (0.35 + d.r * 0.35);
  d.a = rand(0.3, 0.7);
  d.trail = rand(0, 10);
  d.wob = rand(0, 6.28);
  d.slip = rand(0, 4);
}

/* ============================ Update ============================ */
let wiperPhase = 0;
let scrapeLevel = 0;

function update(dt) {
  S.t += dt;
  S.scroll += S.speed * dt;
  S.speedKmh = 82 + Math.sin(S.t * 0.23) * 6 + Math.sin(S.t * 1.7) * 1.2;
  if (S.wiperToast > 0) S.wiperToast = Math.max(0, S.wiperToast - dt);

  for (const b of roadBuildings) {
    b.z -= S.speed * dt;
    if (b.z + b.depth < 1.3) b.z += 72;
  }
  for (const l of lights) {
    l.z -= S.speed * dt;
    if (l.z < 1.4) l.z += 112;
  }

  let maxWash = 0;
  for (const c of cars) {
    c.wob += dt * 0.8;
    if (c.type === 'companion') {
      c.z = c.baseZ + Math.sin(S.t * 0.45 + c.wob) * 2.2;
    } else if (c.type === 'same') {
      c.z -= (S.speed - c.speed) * dt;
      if (c.z < 1.8) c.z = rand(38, 52);
    } else {
      c.z -= (S.speed + c.speed) * dt;
      if (c.z < 5.0 && c.z > 1.5) {
        const w = clamp(1 - (c.z - 1.5) / 3.5, 0, 1);
        if (w > maxWash) maxWash = w;
      }
      if (c.z < 1.5) c.z = rand(40, 56);
    }
  }
  S.wash = lerp(S.wash, maxWash, Math.min(1, dt * 10));

  const rainRate = 0.5 + S.rain * 0.85;
  for (const r of rainFar) {
    r.y += r.v * rainRate * dt; r.x += r.v * rainRate * 0.16 * dt;
    if (r.y > H + 6) { r.y = -8; r.x = rand(-20, W + 10); }
    if (r.x > W + 6) r.x = -8;
  }
  for (const r of rainNear) {
    r.y += r.v * rainRate * dt; r.x += r.v * rainRate * 0.17 * dt;
    if (r.y > H + 12) { r.y = -14; r.x = rand(-30, W + 10); }
    if (r.x > W + 12) r.x = -12;
  }
  for (const s of streaks) {
    s.y += s.spd * rainRate * dt;
    if (s.y > L.wBottom) { s.y = L.wTop; s.x = rand(0, W); }
  }

  const activeDrops = Math.round(drops.length * clamp(S.rain * 1.1, 0, 1));
  for (let i = 0; i < activeDrops; i++) {
    const d = drops[i];
    d.slip += dt;
    d.y += d.v * rainRate * dt * (0.7 + Math.sin(d.slip * 1.3 + d.wob) * 0.35);
    d.x += Math.sin(S.t * 1.7 + d.wob) * dt * 1.6;
    d.trail = Math.min(26, d.trail + d.v * rainRate * dt * 1.6 + dt * 2);
    if (d.y > L.wBottom - 3 || d.x < L.pad + 6 || d.x > W - L.pad - 6) resetDrop(d, true);
  }

  if (S.wiperMode > 0) {
    const period = S.wiperMode === 2 ? 1.05 : 2.75;
    const prev = wiperPhase;
    wiperPhase = (wiperPhase + dt / period) % 1;
    if (prev < 0.5 && wiperPhase >= 0.5) AudioEngine.thump();
  }
  const target = S.wiperMode > 0 ? 0.5 - 0.5 * Math.cos(2 * Math.PI * wiperPhase) : 0;
  for (let i = 0; i < wipers.length; i++) {
    const w = wipers[i];
    const lagTarget = S.wiperMode > 0 ? 0.5 - 0.5 * Math.cos(2 * Math.PI * ((wiperPhase + i * 0.045) % 1)) : 0;
    const tgt = i === 0 ? target : lagTarget;
    w.prevAngle = w.angle;
    w.pos += (tgt - w.pos) * Math.min(1, dt * 26);
    w.angle = lerp(w.a0, w.a1, w.pos);

    if (S.wiperMode > 0 && Math.abs(w.angle - w.prevAngle) > 0.0004) {
      for (let k = activeDrops - 1; k >= 0; k--) {
        const d = drops[k];
        if (!d) continue;
        const dx = d.x - w.px, dy = d.y - w.py;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > w.len * 1.04 || dist < w.len * 0.16) continue;
        const ang = Math.atan2(-dy, dx);
        let diff = ang - w.angle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        if (Math.abs(diff) < 0.085) {
          d.y = L.wTop + rand(-10, 2);
          d.x = rand(L.pad + 12, W - L.pad - 12);
          d.trail = 1;
        }
      }
    }
  }

  let vel = 0;
  if (S.wiperMode > 0) {
    const w0 = wipers[0];
    vel = clamp(Math.abs(w0.angle - w0.prevAngle) / Math.max(dt, 0.001) / 3.2, 0, 1);
  }
  scrapeLevel = lerp(scrapeLevel, vel, Math.min(1, dt * 12));
  AudioEngine.setScrape(scrapeLevel);
}

/* ============================ Projection ============================ */
function proj(u, z) {
  const p = 1.6 / z;
  return {
    p,
    x: L.vpX + u * L.laneW * p,
    y: L.horizon + (L.yB - L.horizon) * p,
    lanePx: L.laneW * p
  };
}

/* ============================ Draw Scene ============================ */
function drawScene() {
  ctx.save();
  windshieldPath();
  ctx.clip();

  // 1. Sky
  const g = ctx.createLinearGradient(0, L.wTop - 4, 0, L.horizon);
  g.addColorStop(0, '#05070f');
  g.addColorStop(0.5, '#0a1020');
  g.addColorStop(1, '#1a2537');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, L.horizon + 2);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  radial(L.vpX + 20, L.horizon - 4, W * 0.42, '120,95,80', 0.15);
  radial(W * 0.75, L.horizon - 8, W * 0.22, '80,120,160', 0.08);
  ctx.restore();

  for (const c of clouds) {
    c.x += c.spd * 0.016;
    if (c.x > W + 80) c.x = -c.w - 40;
    ctx.fillStyle = 'rgba(38,50,72,' + c.a + ')';
    ctx.fillRect(Math.round(c.x), Math.round(c.y), Math.round(c.w), Math.round(c.h * 0.55));
  }

  // 2. Distant Skyline
  for (const b of skyline) {
    const top = L.horizon - b.h;
    ctx.fillStyle = b.col;
    ctx.fillRect(b.x, top, b.w, b.h + 3);
    ctx.fillStyle = 'rgba(110,145,180,0.09)';
    ctx.fillRect(b.x, top, b.w, 1);
    for (const w of b.win) {
      const on = Math.sin(S.t * 0.25 + w.seed) > -0.55;
      ctx.fillStyle = on ? (w.warm ? 'rgba(255,196,130,0.45)' : 'rgba(150,200,235,0.28)') : 'rgba(60,85,110,0.12)';
      ctx.fillRect(b.x + w.x, top + w.y, 1, 1);
    }
  }

  // 3. Roadside Buildings with neon signs
  const sortedB = roadBuildings.slice().sort((a, b) => b.z - a.z);
  for (const b of sortedB) {
    const zNear = Math.max(1.4, b.z), zFar = b.z + b.depth;
    if (zFar < 1.5 || zNear > 75) continue;
    const uIn = b.uInner, uOut = b.uInner + b.side * b.width;
    const pN = proj(uIn, zNear), pF = proj(uIn, zFar), pNOut = proj(uOut, zNear);
    const topN = pN.y - b.height * pN.lanePx, topF = pF.y - b.height * pF.lanePx;

    const fx0 = Math.min(pN.x, pNOut.x), fx1 = Math.max(pN.x, pNOut.x);
    ctx.fillStyle = b.col;
    ctx.fillRect(Math.round(fx0), Math.round(topN), Math.max(1, Math.round(fx1 - fx0)), Math.max(1, Math.round(pN.y - topN)));

    poly([[pN.x, topN], [pF.x, topF], [pF.x, pF.y], [pN.x, pN.y]], b.side < 0 ? '#111823' : '#0f1620');
    ctx.strokeStyle = 'rgba(130,165,200,0.20)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pN.x, topN); ctx.lineTo(pF.x, topF); ctx.stroke();

    for (const w of b.win) {
      const tf = (w.c + 0.5) / 3.5, rf = (w.r + 0.6) / 6;
      const wx = lerp(pN.x, pF.x, tf), wyTop = lerp(topN, topF, tf), wyBot = lerp(pN.y, pF.y, tf);
      const wy = lerp(wyTop, wyBot, rf);
      const on = Math.sin(S.t * 0.2 + w.seed) > -0.4;
      ctx.fillStyle = on ? (w.warm ? 'rgba(255,200,130,0.45)' : 'rgba(140,210,240,0.35)') : 'rgba(40,60,80,0.2)';
      ctx.fillRect(Math.round(wx), Math.round(wy), Math.max(1, Math.round(pN.lanePx * 0.1)), Math.max(1, Math.round(pN.lanePx * 0.14)));
    }

    if (b.hasSign && zNear < 42) {
      const pm = proj(uIn - b.side * 0.16, (zNear + zFar) * 0.5);
      const sw = Math.max(2, Math.round(pm.lanePx * 0.14));
      const syTop = pm.y - b.height * pm.lanePx * 0.78;
      const sh = Math.max(4, Math.round(b.height * pm.lanePx * b.signH));
      ctx.fillStyle = '#090d14'; ctx.fillRect(Math.round(pm.x - sw / 2 - 1), Math.round(syTop - 1), sw + 2, sh + 2);
      ctx.fillStyle = b.signColor; ctx.fillRect(Math.round(pm.x - sw / 2), Math.round(syTop), sw, sh);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      radial(pm.x, syTop + sh * 0.5, Math.max(8, pm.lanePx * 0.6), '255,42,109', 0.25);
      ctx.restore();
    }
  }

  // 4. Road with Asphalt Sheen
  const yH = L.horizon, yB = L.yB;
  rect(0, yH, W, H - yH, '#06090d');
  const pTopL = proj(-0.55, 95), pTopR = proj(3.55, 95);
  const pBotL = proj(-0.55, 1.6), pBotR = proj(3.55, 1.6);
  poly([[pTopL.x, yH], [pTopR.x, yH], [pBotR.x, yB + 25], [pBotL.x, yB + 25]], '#0d131c');

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const sh = ctx.createLinearGradient(0, yH, 0, yH + (yB - yH) * 0.5);
  sh.addColorStop(0, 'rgba(95,130,175,0.12)'); sh.addColorStop(1, 'rgba(95,130,175,0)');
  ctx.fillStyle = sh; ctx.fillRect(0, yH, W, (yB - yH) * 0.5);

  for (const g of puddleGlints) {
    if (g.z < 1.7) continue;
    const pr = proj(g.u, g.z);
    if (pr.y > L.wBottom) continue;
    const flick = 0.55 + 0.45 * Math.sin(S.t * 1.6 + g.seed);
    ctx.fillStyle = 'rgba(170,205,240,' + (g.a * flick) + ')';
    ctx.fillRect(Math.round(pr.x), Math.round(pr.y), Math.max(1, Math.round(pr.p * 5)), 1);
  }
  ctx.restore();

  // Outer road curb lines
  ctx.strokeStyle = 'rgba(180,200,220,0.22)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pTopL.x, yH); ctx.lineTo(pBotL.x, yB + 20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pTopR.x, yH); ctx.lineTo(pBotR.x, yB + 20); ctx.stroke();

  // Lane dividers
  drawLaneDashes(0.5, 'rgba(225,235,245,0.65)'); // Forward lanes
  drawCenterMedian(1.5);                         // Center double barrier
  drawLaneDashes(2.5, 'rgba(225,235,245,0.55)'); // Oncoming lanes

  // 5. Streetlights
  for (const l of lights) {
    if (l.z < 1.55 || l.z > 85) continue;
    const pr = proj(l.u, l.z);
    if (pr.p < 0.018 || pr.x < -70 || pr.x > W + 70) continue;
    const ph = H * 0.68 * pr.p, topY = pr.y - ph, pw = Math.max(1, Math.round(3.2 * pr.p));
    ctx.fillStyle = '#080d12'; ctx.fillRect(Math.round(pr.x - pw / 2), Math.round(topY), pw, Math.round(ph));
    const armLen = Math.max(3, 38 * pr.p);
    const lx = pr.x - l.side * armLen, ly = topY + Math.max(1, Math.round(2 * pr.p));
    ctx.fillStyle = '#ffe3b4'; ctx.fillRect(Math.round(lx - 4), Math.round(ly), Math.max(2, Math.round(7 * pr.p)), Math.max(1, Math.round(2 * pr.p)));
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    radial(lx, ly + 2, Math.max(8, 56 * pr.p), '255,186,110', 0.45);
    ctx.restore();
  }

  // 6. Traffic Cars
  const sortedC = cars.slice().sort((a, b) => b.z - a.z);
  for (const c of sortedC) {
    if (c.z < 1.8) continue;
    const pr = proj(c.u, c.z);
    if (pr.y > L.wBottom + 10) continue;
    const cw = Math.max(3, pr.lanePx * 0.62), chh = cw * 0.56;
    const left = pr.x - cw / 2, top = pr.y - chh;

    ctx.fillStyle = 'rgba(9,11,15,0.95)';
    ctx.fillRect(Math.round(left), Math.round(top + chh * 0.35), Math.round(cw), Math.round(chh * 0.65));
    ctx.fillRect(Math.round(left + cw * 0.16), Math.round(top), Math.round(cw * 0.68), Math.round(chh * 0.45));

    const lw = Math.max(1, Math.round(cw * 0.16)), lh = Math.max(1, Math.round(chh * 0.18)), ly = top + chh * 0.52;
    if (c.type === 'oncoming') {
      ctx.fillStyle = '#fff5dc';
      ctx.fillRect(Math.round(left + cw * 0.10), Math.round(ly), lw, lh);
      ctx.fillRect(Math.round(left + cw * 0.74), Math.round(ly), lw, lh);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      radial(left + cw * 0.18, ly, Math.max(4, cw * 0.85), '255,245,210', 0.42);
      radial(left + cw * 0.82, ly, Math.max(4, cw * 0.85), '255,245,210', 0.42);
      ctx.restore();
    } else {
      ctx.fillStyle = '#ff4436';
      ctx.fillRect(Math.round(left + cw * 0.10), Math.round(ly), lw, lh);
      ctx.fillRect(Math.round(left + cw * 0.74), Math.round(ly), lw, lh);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      radial(left + cw * 0.18, ly, Math.max(3, cw * 0.65), '255,60,40', 0.30);
      radial(left + cw * 0.82, ly, Math.max(3, cw * 0.65), '255,60,40', 0.30);
      ctx.restore();
    }
  }

  // 7. Rain and Streaks
  for (const s of streaks) {
    ctx.fillStyle = 'rgba(175,205,235,' + s.a + ')';
    ctx.fillRect(Math.round(s.x), Math.round(Math.max(L.wTop, s.y - s.len)), 1, Math.round(s.len));
  }
  ctx.lineWidth = 1;
  for (const r of rainFar) {
    if (r.y < L.wTop - 6 || r.y > L.wBottom + 4) continue;
    ctx.strokeStyle = 'rgba(155,185,215,' + r.a + ')';
    ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x + r.len * 0.28, r.y + r.len); ctx.stroke();
  }
  for (const r of rainNear) {
    if (r.y < L.wTop - 10 || r.y > L.wBottom + 6) continue;
    ctx.strokeStyle = 'rgba(185,215,240,' + r.a + ')';
    ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x + r.len * 0.30, r.y + r.len); ctx.stroke();
  }

  // 8. Glass droplets
  for (const d of drops) {
    const x = Math.round(d.x), y = Math.round(d.y);
    if (d.trail > 2) {
      const ty = Math.max(L.wTop, y - d.trail);
      ctx.fillStyle = 'rgba(165,200,230,' + (d.a * 0.45) + ')';
      ctx.fillRect(x, ty, 1, Math.max(1, y - ty));
    }
    ctx.fillStyle = 'rgba(200,230,250,' + (d.a * 0.75) + ')';
    ctx.fillRect(x, y, 1, 1);
  }

  // 9. Animated Wipers
  for (const w of wipers) {
    const cos = Math.cos(w.angle), sin = Math.sin(w.angle);
    const tipx = w.px + cos * w.len, tipy = w.py - sin * w.len;
    ctx.strokeStyle = '#0c1116'; ctx.lineWidth = Math.max(3, Math.round(H * 0.024));
    ctx.beginPath(); ctx.moveTo(w.px, w.py); ctx.lineTo(w.px + cos * w.len * 0.62, w.py - sin * w.len * 0.62); ctx.stroke();
    ctx.strokeStyle = '#1a222b'; ctx.lineWidth = Math.max(4, Math.round(H * 0.032));
    ctx.beginPath(); ctx.moveTo(w.px + cos * w.len * 0.3, w.py - sin * w.len * 0.3); ctx.lineTo(tipx, tipy); ctx.stroke();
  }

  // Toast
  if (S.wiperToast > 0) {
    const txt = ['WIPERS: OFF', 'WIPERS: SLOW', 'WIPERS: FAST'][S.wiperMode];
    rect(L.pad + 10, L.wBottom - 16, 76, 12, '#060a0f');
    pixText(txt, L.pad + 12, L.wBottom - 14, 1, '#59e3cf');
  }

  ctx.restore();
}

function drawLaneDashes(u, color) {
  const P = 8, DASH = 3.4, base = S.scroll;
  ctx.fillStyle = color;
  for (let n = Math.ceil((base + 90) / P); n >= Math.floor((base + 2) / P); n--) {
    let zA = Math.max(1.6, n * P - base);
    let zB = Math.min(95, zA + DASH);
    if (zA >= zB) continue;
    const pA = proj(u, zA), pB = proj(u, zB);
    rect(pA.x - 1, pA.y, 2, Math.max(1, pB.y - pA.y), color);
  }
}

function drawCenterMedian(u) {
  const pTop = proj(u, 95), pBot = proj(u, 1.5);
  ctx.strokeStyle = 'rgba(255,155,70,0.75)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pTop.x, L.horizon); ctx.lineTo(pBot.x - 2, L.yB + 15); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,90,65,0.65)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pTop.x, L.horizon); ctx.lineTo(pBot.x + 2, L.yB + 15); ctx.stroke();
}

/* ============================ Draw Cabin ============================ */
function drawCabin() {
  const d = L.dashTop;

  // 1. Dashboard body
  poly([[-2, H + 2], [-2, d + 16], [W * 0.06, d + 11], [W * 0.24, d + 4], [W * 0.46, d + 10], [W * 0.74, d - 2], [W + 2, d + 17], [W + 2, H + 2]], '#0e141c');
  rect(-2, d + 16, W + 4, 1, '#2c3b4a');

  // Passenger ambient strip
  ctx.fillStyle = 'rgba(60,200,180,0.16)';
  ctx.fillRect(Math.round(W * 0.08), Math.round(d + 7), Math.round(W * 0.18), 1);

  // Vents
  ctx.fillStyle = '#05080b';
  for (let i = 0; i < 5; i++) {
    ctx.fillRect(Math.round(W * 0.18 + i * 7), Math.round(d + 11), 4, 1);
    ctx.fillRect(Math.round(W * 0.88 + i * 7), Math.round(d + 13), 4, 1);
  }

  // 2. High-detail RHD Gauge Cluster (Right side)
  const cy = Math.round(H * 0.785);
  const cx1 = Math.round(W * 0.825);
  const cx2 = Math.round(W * 0.700);

  ctx.fillStyle = '#06090c';
  ctx.beginPath();
  ctx.ellipse(W * 0.76, cy + Math.round(H * 0.02), W * 0.19, H * 0.13, 0, Math.PI, Math.PI * 2);
  ctx.fill();

  drawGauge(cx1, cy, Math.round(H * 0.072), clamp((S.speedKmh - 40) / 120, 0, 1), 'KM/H');
  drawGauge(cx2, cy + 2, Math.round(H * 0.050), 0.30 + Math.sin(S.t * 0.8) * 0.03, 'RPM', '90,200,190');
  pixText(String(Math.round(S.speedKmh)), cx1 - 6, cy + Math.round(H * 0.035), 1, '#ffb457');

  // 3. Right-hand drive steering wheel
  const wcx = W * 0.815, wcy = H * 1.035;
  ellipseRing(wcx, wcy, W * 0.172, H * 0.245, 12, '#0b0e13');
  pixCircle(wcx, wcy, Math.round(H * 0.055), '#0a0e13');

  // 4. Big Rain Dial (Left)
  drawBigRainDial();

  // 5. In-Dash Stereo Deck
  drawStereoDeck();

  // 6. A-pillars, roof, mirror, freshener
  drawApillar(false);
  drawApillar(true);
  drawRoof();
  drawMirror();
}

function drawGauge(cx, cy, r, frac, label, tint) {
  pixCircle(cx, cy + 1, r + 2, 'rgba(0,0,0,0.55)');
  pixCircle(cx, cy, r + 1, '#05080b');
  pixCircle(cx, cy, r, '#121a21');
  ctx.save();
  radial(cx, cy, r, tint || '255,150,60', 0.20);
  ctx.restore();

  const start = Math.PI * 0.78, span = Math.PI * 1.44;
  for (let i = 0; i <= 16; i++) {
    const a = start + span * (i / 16);
    const r0 = r - (i % 2 === 0 ? 4 : 3);
    ctx.strokeStyle = i % 2 === 0 ? 'rgba(255,186,110,0.82)' : 'rgba(255,170,90,0.30)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    ctx.lineTo(cx + Math.cos(a) * (r - 1.2), cy + Math.sin(a) * (r - 1.2));
    ctx.stroke();
  }

  const na = start + span * clamp(frac, 0, 1);
  ctx.strokeStyle = '#ff7a48'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(na) * (r - 4), cy + Math.sin(na) * (r - 4)); ctx.stroke();
  pixCircle(cx, cy, 2, '#2b333d');
  if (label) pixText(label, cx - 6, cy + r * 0.52, 1, 'rgba(255,190,120,0.55)');
}

function drawBigRainDial() {
  const dial = UI.dialRain;
  pixText('RAIN', dial.cx - 7, dial.cy - dial.r - 9, 1, '#7fe9d6');
  pixCircle(dial.cx, dial.cy, dial.r + 3, '#05080c');
  pixCircle(dial.cx, dial.cy, dial.r - 1, '#1a242f');

  const aStart = rad(135), aSpan = rad(270);
  for (let i = 0; i <= 10; i++) {
    const a = aStart + aSpan * (i / 10);
    const lit = S.rain > 0.01 && (i / 10) <= S.rain + 0.04;
    ctx.fillStyle = lit ? (i > 7 ? '#ffb457' : '#59e3cf') : 'rgba(80,105,125,0.28)';
    ctx.fillRect(Math.round(dial.cx + Math.cos(a) * (dial.r + 1)), Math.round(dial.cy + Math.sin(a) * (dial.r + 1)), 2, 2);
  }

  const pointerAng = aStart + aSpan * S.rain;
  ctx.strokeStyle = '#ffd194'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(dial.cx, dial.cy);
  ctx.lineTo(dial.cx + Math.cos(pointerAng) * (dial.r - 4), dial.cy + Math.sin(pointerAng) * (dial.r - 4));
  ctx.stroke();
}

function drawStereoDeck() {
  const x = L.deckX, y = L.deckY, w = L.deckW, h = L.deckH;
  rect(x - 3, y - 2, w + 6, h + 4, '#080c10');
  rect(x, y, w, h, '#121820');

  // Left button column
  rect(x + 2, y + 2, 54, h - 4, '#090d12');
  pixText('CAR-DECK', x + 6, y + 5, 1, '#5d7488');

  // 1. LOCAL
  const b1 = UI.btnLocal, b1Act = S.mode === 'local';
  rect(b1.x, b1.y, b1.w, b1.h, pressedBtn === 'local' ? '#072422' : (b1Act ? '#0d3b38' : '#16202a'));
  pixCircle(b1.x + 6, b1.y + 8, 2, b1Act ? '#59e3cf' : '#22303c');
  pixText('LOCAL', b1.x + 13, b1.y + 5, 1, b1Act ? '#59e3cf' : '#91a7ba');

  // 2. SPOTIFY
  const b2 = UI.btnSpotify, b2Act = S.mode === 'spotify';
  rect(b2.x, b2.y, b2.w, b2.h, pressedBtn === 'spotify' ? '#072422' : (b2Act ? '#0d3b38' : '#16202a'));
  pixCircle(b2.x + 6, b2.y + 8, 2, b2Act ? '#59e3cf' : '#22303c');
  pixText('SPOTIFY', b2.x + 12, b2.y + 5, 1, b2Act ? '#59e3cf' : '#91a7ba');

  // 3. + MP3
  const b3 = UI.btnLoadMp3;
  rect(b3.x, b3.y, b3.w, b3.h, pressedBtn === 'loadMp3' ? '#171109' : '#261e14');
  pixText('+ MP3', b3.x + 14, b3.y + 5, 1, '#ffd7a0');

  // LCD Bezel
  const lcd = UI.lcd;
  rect(lcd.x, lcd.y, lcd.w, lcd.h, '#030a09');

  if (S.mode === 'local') {
    spSlot.style.display = 'none';

    // Status tag
    rect(lcd.x + 3, lcd.y + 3, 20, 8, '#161008');
    pixText(S.playing ? 'PLAY' : (localTracks.length ? 'PAUS' : 'IDLE'), lcd.x + 4, lcd.y + 4, 1, '#ffb457');

    // CAR EQ Button
    const eq = UI.btnCarEq;
    rect(eq.x, eq.y, eq.w, eq.h, S.carEq ? '#0a2c29' : '#051010');
    pixText('CAR', eq.x + 3, eq.y + 2, 1, S.carEq ? '#59e3cf' : '#334e4b');

    // Scrolling track title
    ctx.save();
    ctx.beginPath(); ctx.rect(lcd.x + 28, lcd.y + 3, lcd.w - 52, 10); ctx.clip();
    marqueeOffset = (marqueeOffset + 0.35) % 240;
    pixText(trackTitle, lcd.x + 28 - marqueeOffset, lcd.y + 4, 1, '#7fe9d6');
    pixText(trackTitle, lcd.x + 28 - marqueeOffset + 180, lcd.y + 4, 1, '#7fe9d6');
    ctx.restore();

    // Visualizer bars
    for (let i = 0; i < 18; i++) {
      let bh = 1;
      if (S.playing) bh = Math.round(Math.abs(Math.sin(S.t * (3.5 + i * 0.4) + i)) * 18) + 1;
      rect(lcd.x + 14 + i * 6, lcd.y + 38 - bh, 4, bh, '#124c43');
      rect(lcd.x + 14 + i * 6, lcd.y + 38 - Math.min(bh, 4), 4, Math.min(bh, 4), '#59e3cf');
    }

    // Transport buttons
    const bp = UI.btnPrev;
    rect(bp.x, bp.y, bp.w, bp.h, pressedBtn === 'prev' ? '#183430' : '#0c1a18');
    pixText('<<', bp.x + 4, bp.y + 4, 1, '#59e3cf');

    const bply = UI.btnPlay;
    rect(bply.x, bply.y, bply.w, bply.h, S.playing ? '#ffcf8a' : '#0c1a18');
    pixText(S.playing ? '||' : '>', bply.x + 6, bply.y + 4, 1, S.playing ? '#111' : '#59e3cf');

    const bn = UI.btnNext;
    rect(bn.x, bn.y, bn.w, bn.h, pressedBtn === 'next' ? '#183430' : '#0c1a18');
    pixText('>>', bn.x + 4, bn.y + 4, 1, '#59e3cf');

    // Volume bar
    pixText('VOL', lcd.x + 67, lcd.y + 50, 1, '#5c8f87');
    const vb = UI.volBar;
    rect(vb.x, vb.y, vb.w, vb.h, '#040d0c');
    rect(vb.x, vb.y, Math.round(vb.w * S.vol), vb.h, '#ffb457');
  } else {
    positionSpSlot();
  }
}

function drawApillar(flip) {
  const x = flip ? W : 0;
  const outer = flip ? W - L.pad - 14 : L.pad + 14;
  const innerBottom = flip ? W - L.pad + 2 : L.pad - 2;
  poly([[x, -2], [outer, L.wTop - 2], [innerBottom, L.wBottom + 4], [x, H + 2]], '#070a0d');
}

function drawRoof() {
  rect(-2, -2, W + 4, L.wTop + 6, '#070a0d');
  ctx.save();
  windshieldPath();
  ctx.strokeStyle = '#05080b'; ctx.lineWidth = 4; ctx.stroke();
  ctx.restore();
}

function drawMirror() {
  const cx = L.mirrorCx, w = L.mirrorW, h = L.mirrorH, y = L.mirrorY;
  rect(cx - 3, 0, 6, y + 4, '#0a0e12');
  rect(cx - w / 2, y, w, h, '#151b22');
  rect(cx - w / 2 + 3, y + 3, w - 6, h - 6, '#0a1218');

  // Pine freshener
  const sway = Math.sin(S.t * 1.15) * 2.2;
  ctx.strokeStyle = 'rgba(190,200,210,0.35)';
  ctx.beginPath(); ctx.moveTo(cx + 14, y + h); ctx.lineTo(cx + 14 + sway, y + h + 7); ctx.stroke();
  const px = cx + 14 + sway, py = y + h + 8;
  poly([[px, py], [px - 4, py + 10], [px + 4, py + 10]], '#123a2a');
}

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawScene();
  drawCabin();
}

let lastT = 0;
function loop(now) {
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  update(Math.min(dt, 0.05));
  draw();
  requestAnimationFrame(loop);
}

/* ============================ Coordinate Hit-Testing ============================ */
function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const canvasAspect = W / H;
  const rectAspect = rect.width / rect.height;

  let renderW, renderH, offsetX, offsetY;
  if (rectAspect > canvasAspect) {
    renderH = rect.height;
    renderW = renderH * canvasAspect;
    offsetX = (rect.width - renderW) / 2;
    offsetY = 0;
  } else {
    renderW = rect.width;
    renderH = renderW / canvasAspect;
    offsetX = 0;
    offsetY = (rect.height - renderH) / 2;
  }

  const clientX = e.clientX - rect.left - offsetX;
  const clientY = e.clientY - rect.top - offsetY;
  const scale = renderW / W;

  return {
    x: clientX / scale,
    y: clientY / scale,
    inside: clientX >= 0 && clientX <= renderW && clientY >= 0 && clientY <= renderH
  };
}

function isInside(pt, box) {
  return pt.x >= box.x && pt.x <= box.x + box.w && pt.y >= box.y && pt.y <= box.y + box.h;
}

function positionSpSlot() {
  if (S.mode !== 'spotify') {
    spSlot.style.display = 'none';
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const canvasAspect = W / H;
  const rectAspect = rect.width / rect.height;
  let renderW, renderH, offsetX, offsetY;
  if (rectAspect > canvasAspect) {
    renderH = rect.height;
    renderW = renderH * canvasAspect;
    offsetX = (rect.width - renderW) / 2;
    offsetY = 0;
  } else {
    renderW = rect.width;
    renderH = renderW / canvasAspect;
    offsetX = 0;
    offsetY = (rect.height - renderH) / 2;
  }
  const scale = renderW / W;

  spSlot.style.display = 'block';
  spSlot.style.left = Math.round(rect.left + offsetX + UI.lcd.x * scale) + 'px';
  spSlot.style.top = Math.round(rect.top + offsetY + UI.lcd.y * scale) + 'px';
  spSlot.style.width = Math.round(UI.lcd.w * scale) + 'px';
  spSlot.style.height = Math.round(UI.lcd.h * scale) + 'px';
}

/* ============================ Player & Mode Control ============================ */
function setMode(mode) {
  if (S.mode === mode) return;
  AudioEngine.unlock();
  AudioEngine.click();
  S.mode = mode;

  if (mode === 'spotify') {
    localAudio.pause();
    S.playing = false;
    spFrame.src = SPOTIFY_SRC;
    positionSpSlot();
  } else {
    spFrame.src = 'about:blank';
    spSlot.style.display = 'none';
  }
}

function playTrack(idx) {
  if (!localTracks.length) return;
  AudioEngine.unlock();
  AudioEngine.click();
  trackIndex = ((idx % localTracks.length) + localTracks.length) % localTracks.length;
  const tr = localTracks[trackIndex];
  localAudio.src = tr.url;
  localAudio.volume = S.vol;
  trackTitle = tr.name;
  marqueeOffset = 0;
  localAudio.play().then(() => { S.playing = true; }).catch(() => { S.playing = false; });
}

function togglePlay() {
  AudioEngine.unlock();
  if (!localTracks.length) { fileInput.click(); return; }
  if (!localAudio.src) { playTrack(0); return; }
  if (localAudio.paused) {
    localAudio.play().then(() => { S.playing = true; }).catch(() => { S.playing = false; });
  } else {
    localAudio.pause();
    S.playing = false;
  }
}

fileInput.addEventListener('change', e => {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  localTracks = files.map(f => ({
    name: f.name.replace(/\.[^.]+$/, '').toUpperCase(),
    url: URL.createObjectURL(f)
  }));
  trackIndex = 0;
  setMode('local');
  playTrack(0);
  e.target.value = '';
});

localAudio.addEventListener('ended', () => playTrack(trackIndex + 1));
localAudio.addEventListener('play', () => { S.playing = true; });
localAudio.addEventListener('pause', () => { S.playing = false; });

/* ============================ Pointer Handlers ============================ */
canvas.addEventListener('pointerdown', e => {
  const pt = getCanvasCoords(e);
  if (!pt.inside) return;
  AudioEngine.unlock();

  // Rain dial
  if (Math.hypot(pt.x - UI.dialRain.cx, pt.y - UI.dialRain.cy) <= UI.dialRain.r) {
    pressedBtn = 'dialRain';
    S.rain = (S.rain + 0.25);
    if (S.rain > 1.01) S.rain = 0;
    AudioEngine.setRain(S.rain);
    AudioEngine.click();
    return;
  }

  // Left buttons
  if (isInside(pt, UI.btnLocal)) {
    pressedBtn = 'local';
    setMode('local');
    return;
  }
  if (isInside(pt, UI.btnSpotify)) {
    pressedBtn = 'spotify';
    setMode('spotify');
    return;
  }
  if (isInside(pt, UI.btnLoadMp3)) {
    pressedBtn = 'loadMp3';
    fileInput.click();
    return;
  }

  // LCD controls
  if (S.mode === 'local') {
    if (isInside(pt, UI.btnCarEq)) {
      pressedBtn = 'carEq';
      S.carEq = !S.carEq;
      AudioEngine.setCarEq(S.carEq);
      AudioEngine.click();
      return;
    }
    if (isInside(pt, UI.btnPrev)) {
      pressedBtn = 'prev';
      playTrack(trackIndex - 1);
      return;
    }
    if (isInside(pt, UI.btnPlay)) {
      pressedBtn = 'play';
      togglePlay();
      return;
    }
    if (isInside(pt, UI.btnNext)) {
      pressedBtn = 'next';
      playTrack(trackIndex + 1);
      return;
    }
    if (isInside(pt, UI.volBar)) {
      isDraggingVol = true;
      S.vol = clamp((pt.x - UI.volBar.x) / UI.volBar.w, 0, 1);
      localAudio.volume = S.vol;
      return;
    }
  }
});

window.addEventListener('pointermove', e => {
  const pt = getCanvasCoords(e);
  if (isDraggingVol) {
    S.vol = clamp((pt.x - UI.volBar.x) / UI.volBar.w, 0, 1);
    localAudio.volume = S.vol;
    return;
  }
  let hover = false;
  if (pt.inside) {
    if (Math.hypot(pt.x - UI.dialRain.cx, pt.y - UI.dialRain.cy) <= UI.dialRain.r) hover = true;
    else if (isInside(pt, UI.btnLocal) || isInside(pt, UI.btnSpotify) || isInside(pt, UI.btnLoadMp3)) hover = true;
    else if (S.mode === 'local' && (isInside(pt, UI.btnCarEq) || isInside(pt, UI.btnPrev) || isInside(pt, UI.btnPlay) || isInside(pt, UI.btnNext) || isInside(pt, UI.volBar))) hover = true;
  }
  canvas.style.cursor = hover ? 'pointer' : 'default';
});

window.addEventListener('pointerup', () => {
  pressedBtn = null;
  isDraggingVol = false;
});

// Wiper toggle & shortcuts
document.addEventListener('keydown', e => {
  AudioEngine.unlock();
  if (e.key === 'w' || e.key === 'W') {
    S.wiperMode = (S.wiperMode + 1) % 3;
    S.wiperToast = 1.8;
  } else if (e.code === 'Space') {
    e.preventDefault();
    if (S.mode === 'local') togglePlay();
  }
});

/* ============================ Boot ============================ */
function onResize() {
  layout();
  seedScene();
  positionSpSlot();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

onResize();
requestAnimationFrame(loop);
</script>
