<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070b" />
<title>Rainy Night Drive — Tokyo 16-bit</title>
<style>
  :root{
    --amber:#ffb457;
    --amber-soft:#ffd7a0;
    --teal:#59e3cf;
    --line:#33414f;
    --text:#a3b6c7;
    --marq-dur:16s;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#000;overflow:hidden}
  body{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
    color:var(--text);
    -webkit-font-smoothing:none;
  }
  #screen{
    position:fixed;inset:0;width:100%;height:100%;display:block;
    object-fit:contain;background:#000;z-index:0;
    image-rendering:pixelated;image-rendering:crisp-edges;
  }

  /* ---------- HUD / radio ---------- */
  #hud{
    position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%);
    width:min(540px,calc(100vw - 20px));
    z-index:20;display:flex;flex-direction:column;gap:6px;
    padding:8px 10px;
    background:linear-gradient(#151d26,#0a0e13);
    border:2px solid var(--line);
    box-shadow:inset 0 0 0 2px #060a0e, inset 0 1px 0 #4d5f70, 0 12px 34px rgba(0,0,0,.8);
    opacity:0;pointer-events:none;transition:opacity .55s ease;
  }
  body.started #hud{opacity:1;pointer-events:auto}
  .row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .row.small{gap:12px;padding-top:2px;justify-content:space-between}

  .btn{
    appearance:none;-webkit-appearance:none;border:2px solid #3b4b5b;
    background:linear-gradient(#202a35,#121920);
    color:var(--amber-soft);
    font:inherit;font-size:11px;line-height:1;letter-spacing:.09em;
    padding:6px 8px;min-height:30px;cursor:pointer;text-transform:uppercase;
    box-shadow:inset 1px 1px 0 #4f6273, inset -1px -1px 0 #070b0f;
    transition:background .12s,color .12s;
    user-select:none;
  }
  .btn:hover{background:linear-gradient(#2a3846,#161f28);color:#ffe6bd}
  .btn.icon{min-width:32px;font-size:11px;letter-spacing:0}
  .btn.play{color:#0a1014;background:linear-gradient(#ffcf8a,#e79a3c);border-color:#ffd9a2;min-width:38px;
    box-shadow:inset 1px 1px 0 #fff0cf, inset -1px -1px 0 #8b5416}
  .btn.play:hover{background:linear-gradient(#ffe0ac,#f0a63f)}
  .btn.wide{font-size:9px}
  
  .seg{display:flex;gap:0}
  .seg .btn{border-right-width:0;min-width:40px;padding:6px 6px}
  .seg .btn:last-child{border-right-width:2px}
  .seg .btn.active{background:linear-gradient(#0d3b39,#07211f);color:var(--teal);
    box-shadow:inset 0 0 0 1px #1d6b62, inset 0 0 8px rgba(89,227,207,.25);border-color:#2b7d72}

  .tabs{display:flex;gap:4px;margin-bottom:1px;}
  .tab{padding:3px 8px;font-size:9px;background:#121920;border:1px solid #3b4b5b;color:#7d93a6;cursor:pointer;text-transform:uppercase;letter-spacing:0.1em;}
  .tab.active{background:#0d3b39;border-color:var(--teal);color:var(--teal);}

  .marquee{
    flex:1 1 180px;min-width:130px;overflow:hidden;position:relative;
    border:2px solid #2d3a47;background:linear-gradient(#07100f,#040a09);
    box-shadow:inset 0 0 12px rgba(89,227,207,.10);
    padding:5px 0;
  }
  .marquee:before,.marquee:after{
    content:"";position:absolute;top:0;bottom:0;width:14px;z-index:2;pointer-events:none;
  }
  .marquee:before{left:0;background:linear-gradient(90deg,#040a09,rgba(4,10,9,0))}
  .marquee:after{right:0;background:linear-gradient(270deg,#040a09,rgba(4,10,9,0))}
  .scroll{display:block;white-space:nowrap;will-change:transform;animation:marq var(--marq-dur) linear infinite}
  .scroll span{display:inline-block;padding-right:0;font-size:11px;letter-spacing:.11em;color:#7fe9d6;text-transform:uppercase}
  @keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  .badge{
    font-size:9px;letter-spacing:.16em;padding:4px 6px;
    border:1px solid #35505a;color:#7fe9d6;background:#081411;
  }

  .vol{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:.14em;color:#7d93a6}
  .vol input[type=range]{
    -webkit-appearance:none;appearance:none;width:80px;height:9px;background:#050a0d;
    border:2px solid #2b3946;cursor:pointer;margin:0;
    box-shadow:inset 0 0 0 1px #000;
  }
  .vol input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:8px;height:13px;border:0;
    background:linear-gradient(#ffd7a0,#e79a3c);box-shadow:0 0 6px rgba(255,170,70,.7);
  }

  .spotify-wrap { width: 100%; border: 2px solid #2d3a47; background: #040a09; }
  .spotify-wrap iframe { width: 100%; height: 130px; border: 0; display: block; }
  [hidden] { display: none !important; }

  /* ---------- intro / boot screen ---------- */
  #intro{
    position:fixed;inset:0;z-index:40;display:grid;place-items:center;
    background:#020408;
    transition:opacity .65s ease, visibility .65s ease;
  }
  #intro.hide{opacity:0;visibility:hidden;pointer-events:none}
  
  .terminal-box{
    width:min(540px,calc(100vw - 30px));
    padding:22px 24px;
    border:2px solid #2b3946;
    background:#070b10;
    box-shadow:inset 0 0 0 2px #030508, 0 0 40px rgba(89,227,207,.08);
  }
  .boot-log{
    font-size:10px;line-height:1.6;color:#59e3cf;min-height:110px;margin-bottom:16px;
    white-space:pre-wrap;word-break:break-all;
  }

  .card-action{display:flex;flex-direction:column;align-items:center;border-top:1px solid #1a2530;padding-top:16px;}
  .eyebrow{font-size:9px;letter-spacing:.4em;color:#5f7d92;margin-bottom:6px}
  .card h1{
    margin:0 0 8px;font-size:clamp(17px,4vw,24px);letter-spacing:.14em;
    color:#ffc27a;font-weight:400;text-transform:uppercase;
  }
  .start{
    appearance:none;border:2px solid #ffd7a0;cursor:pointer;
    background:linear-gradient(#ffcf8a,#e2912f);color:#160c03;
    font:inherit;font-size:11px;letter-spacing:.18em;padding:11px 20px;min-height:40px;
    box-shadow:inset 1px 1px 0 #fff2d6, inset -1px -1px 0 #8a4f12;
    opacity:0.3;pointer-events:none;transition:opacity 0.3s;
  }
  .start.ready{opacity:1;pointer-events:auto;animation:pulseBtn 1.5s infinite;}
  .start:hover{background:linear-gradient(#ffe2b0,#f0a63f)}
  @keyframes pulseBtn {
    0%, 100% { box-shadow: inset 1px 1px 0 #fff2d6, inset -1px -1px 0 #8a4f12, 0 0 10px rgba(255,170,70,0.4); }
    50% { box-shadow: inset 1px 1px 0 #fff2d6, inset -1px -1px 0 #8a4f12, 0 0 22px rgba(255,170,70,0.8); }
  }
</style>
</head>
<body>
<canvas id="screen" width="480" height="270" aria-label="Pixel art view from inside a car driving on a rainy Japanese street"></canvas>

<div id="hud" aria-label="Radio and wiper controls">
  <div class="tabs">
    <button id="tabLocal" class="tab active" type="button">Local / Audio Files</button>
    <button id="tabSpotify" class="tab" type="button">Spotify Playlist</button>
  </div>

  <div id="viewLocal" class="row">
    <button id="prevBtn" class="btn icon" title="Previous track (P)" aria-label="Previous track">&#9664;&#9664;</button>
    <button id="playBtn" class="btn play" title="Play / pause (Space)" aria-label="Play">&#9654;</button>
    <button id="nextBtn" class="btn icon" title="Next track (N)" aria-label="Next track">&#9654;&#9654;</button>
    <div class="marquee" aria-live="polite"><div class="scroll" id="marquee">
      <span id="m1">01 &middot; TRACK 1</span><span id="m2" aria-hidden="true">01 &middot; TRACK 1</span>
    </div></div>
    <button id="loadBtn" class="btn wide" title="Play audio files from your device">Load Local Files</button>
  </div>

  <div id="viewSpotify" class="spotify-wrap" hidden>
    <iframe src="https://open.spotify.com/embed/playlist/7DonEO3QSanBOXTQ5vVHdx?utm_source=generator&theme=0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  </div>

  <div class="row small">
    <div class="seg" role="group" aria-label="Wiper speed">
      <button class="btn segbtn" data-mode="0">Off</button>
      <button class="btn segbtn active" data-mode="1">Slow</button>
      <button class="btn segbtn" data-mode="2">Fast</button>
    </div>
    <label class="vol">Rain <input id="rainVol" type="range" min="0" max="100" value="55" aria-label="Rain volume"></label>
    <label class="vol">Music <input id="musicVol" type="range" min="0" max="100" value="55" aria-label="Music volume"></label>
    <span class="badge" id="badge">MP3</span>
  </div>
  <input id="fileInput" type="file" accept="audio/*" multiple hidden>
</div>

<div id="intro">
  <div class="terminal-box">
    <div class="boot-log" id="bootLog">INITIALIZING TOKYO_DRIVE_KERNEL v2.0...</div>
    <div class="card-action">
      <div class="eyebrow">16-BIT &middot; TOKYO RAIN &middot; CYBERPUNK</div>
      <h1>Rainy Night Drive</h1>
      <button id="startBtn" class="start">&#9654; IGNITE ENGINE</button>
    </div>
  </div>
</div>

<script>
/* Boot sequence */
const bootLogs = [
  "> CPU: NEON-16 12MHz Processor OK",
  "> MEMORY: 64KB RAM Verified",
  "> LOADING TOKYO STREET ASSETS & NEON SIGNS ... [OK]",
  "> SYNCHRONIZING WIPER ACTUATORS ... [OK]",
  "> ESTABLISHING DASHBOARD AMBIENCE ... [READY]"
];
let logIndex = 0;
const logContainer = document.getElementById('bootLog');
const startButton = document.getElementById('startBtn');

function runBootSequence() {
  if (logIndex < bootLogs.length) {
    logContainer.textContent += "\n" + bootLogs[logIndex];
    logIndex++;
    setTimeout(runBootSequence, 280);
  } else {
    startButton.classList.add('ready');
  }
}
setTimeout(runBootSequence, 300);

/* ============================ setup ============================ */
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 480, H = 270;
const L = {};

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rad = d => d * Math.PI / 180;

const S = {
  t: 0,
  scroll: 0,
  speed: 16,
  wiperMode: 1,
  rain: 0.55,
  music: 0.55,
  speedKmh: 84
};

/* Pixel Font */
const FONT = {
  '0':'111,101,101,101,111','1':'010,110,010,010,111','2':'111,001,111,100,111',
  '3':'111,001,111,001,111','4':'101,101,111,001,001','5':'111,100,111,001,111',
  '6':'111,100,111,101,111','7':'111,001,010,010,010','8':'111,101,111,101,111',
  '9':'111,101,111,001,111',
  'A':'010,101,111,101,101','B':'110,101,110,101,110','C':'011,100,100,100,011',
  'D':'110,101,101,101,110','E':'111,100,110,100,111','F':'111,100,110,100,100',
  'G':'011,100,101,101,011','H':'101,101,111,101,101','I':'111,010,010,010,111',
  'J':'001,001,001,101,010','K':'101,101,110,101,101','L':'100,100,100,100,111',
  'M':'101,111,111,101,101','N':'101,111,111,111,101','O':'010,101,101,101,010',
  'P':'110,101,110,100,100','Q':'010,101,101,111,011','R':'110,101,110,101,101',
  'S':'011,100,010,001,110','T':'111,010,010,010,010','U':'101,101,101,101,111',
  'V':'101,101,101,101,010','W':'101,101,111,111,101','X':'101,101,010,101,101',
  'Y':'101,101,010,010,010','Z':'111,001,010,100,111',
  ':':'000,010,000,010,000','.':'000,000,000,000,010','-':'000,000,111,000,000',
  '/':'001,001,010,100,100',' ':'000,000,000,000,000','+':'000,010,111,010,000'
};
function pixText(str, x, y, scale, color) {
  ctx.fillStyle = color;
  let cx = Math.round(x);
  const s = Math.max(1, Math.round(scale));
  for (const ch of String(str).toUpperCase()) {
    const g = FONT[ch];
    if (g) {
      const rows = g.split(',');
      for (let r = 0; r < rows.length; r++) {
        for (let c = 0; c < 3; c++) {
          if (rows[r][c] === '1') ctx.fillRect(cx + c * s, Math.round(y) + r * s, s, s);
        }
      }
    }
    cx += 4 * s;
  }
  return cx;
}

function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
}
function poly(points, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(Math.round(points[0][0]), Math.round(points[0][1]));
  for (let i = 1; i < points.length; i++) ctx.lineTo(Math.round(points[i][0]), Math.round(points[i][1]));
  ctx.closePath();
  ctx.fill();
}
function pixCircle(cx, cy, r, color) {
  ctx.fillStyle = color;
  cx = Math.round(cx); cy = Math.round(cy);
  for (let y = -r; y <= r; y++) {
    const w = Math.floor(Math.sqrt(Math.max(0, r * r - y * y)));
    ctx.fillRect(cx - w, cy + y, w * 2 + 1, 1);
  }
}
function radial(x, y, r, rgb, a) {
  if (r <= 0.5 || a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')');
  g.addColorStop(0.35, 'rgba(' + rgb + ',' + (a * 0.45) + ')');
  g.addColorStop(0.7, 'rgba(' + rgb + ',' + (a * 0.14) + ')');
  g.addColorStop(1, 'rgba(' + rgb + ',0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}
function ellipseRing(cx, cy, rx, ry, thick, color) {
  ctx.fillStyle = color;
  for (let y = -ry; y <= ry; y++) {
    const t = y / ry;
    const half = rx * Math.sqrt(Math.max(0, 1 - t * t));
    const ryi = ry - thick;
    const rxi = rx - thick;
    let inner = 0;
    if (ryi > 0 && Math.abs(y) < ryi) {
      const t2 = y / ryi;
      inner = rxi * Math.sqrt(Math.max(0, 1 - t2 * t2));
    }
    if (half - inner > 0.4) {
      const w = Math.round(half - inner);
      if (w < 1) continue;
      ctx.fillRect(Math.round(cx - half), Math.round(cy + y), w, 1);
      ctx.fillRect(Math.round(cx + inner), Math.round(cy + y), w, 1);
    }
  }
}

const wipers = [
  { px: 0, py: 0, len: 0, a0: rad(171), a1: rad(46), angle: rad(171), pos: 0, prevAngle: rad(171) },
  { px: 0, py: 0, len: 0, a0: rad(166), a1: rad(40), angle: rad(166), pos: 0, prevAngle: rad(166) }
];

function layout() {
  L.horizon = Math.round(H * 0.44);
  L.wTop = Math.round(H * 0.062);
  L.wBottom = Math.round(H * 0.695);
  L.yB = Math.round(H * 0.755);
  L.cx = W / 2;
  L.pad = Math.round(W * 0.055);
  L.dashTop = Math.round(H * 0.668);

  wipers[0].px = Math.round(W * 0.295);
  wipers[0].py = Math.round(H * 0.80);
  wipers[0].len = Math.round(H * 0.615);

  wipers[1].px = Math.round(W * 0.665);
  wipers[1].py = Math.round(H * 0.815);
  wipers[1].len = Math.round(H * 0.435);

  L.mirrorCx = Math.round(W / 2);
  L.mirrorW = Math.round(W * 0.20);
  L.mirrorH = Math.round(H * 0.105);
  L.mirrorY = Math.round(H * 0.045);
}

function windshieldPath() {
  const x0 = L.pad, x1 = W - L.pad, top = L.wTop, bot = L.wBottom;
  const slope = Math.round(W * 0.012);
  ctx.beginPath();
  ctx.moveTo(x0 + 10, top);
  ctx.lineTo(x1 - 10, top);
  ctx.quadraticCurveTo(x1, top + 1, x1 - slope, top + 14);
  ctx.lineTo(x1 - slope, bot - 6);
  ctx.quadraticCurveTo(x1 - slope, bot, x1 - slope - 8, bot);
  ctx.lineTo(x0 + slope + 8, bot);
  ctx.quadraticCurveTo(x0 + slope, bot, x0 + slope, bot - 6);
  ctx.lineTo(x0 + slope, top + 14);
  ctx.quadraticCurveTo(x0, top + 1, x0 + 10, top);
  ctx.closePath();
}

let clouds = [], japaneseBuildings = [], lights = [], cars = [], puddleGlints = [];

function seedScene() {
  clouds = [];
  for (let i = 0; i < 8; i++) {
    clouds.push({ x: rand(-100, W + 40), y: rand(L.wTop, L.horizon * 0.55), w: rand(46, 150), h: rand(9, 26), a: rand(0.05, 0.16), spd: rand(0.4, 1.4) });
  }

  japaneseBuildings = [];
  let bx = -30;
  while (bx < W + 40) {
    const bw = randi(18, 36);
    const bh = randi(35, Math.min(85, Math.round(L.horizon * 0.95)));
    const signs = [];
    if (Math.random() < 0.8) {
      signs.push({
        y: randi(5, bh - 20),
        h: randi(10, 25),
        color: Math.random() < 0.5 ? '#ff2a6d' : (Math.random() < 0.5 ? '#05d9e8' : '#ffb457'),
        side: Math.random() < 0.5 ? 'left' : 'right'
      });
    }
    japaneseBuildings.push({ x: bx, w: bw, h: bh, signs, col: '#070a0f' });
    bx += bw + randi(2, 8);
  }

  lights = [];
  for (let i = 0; i < 7; i++) lights.push({ side: i % 2 === 0 ? -1 : 1, z: 2.4 + i * 26, seed: rand(0, 6.28) });
  
  cars = [
    { z: 12, lane: 0.32, speed: 28, type: 'oncoming' },
    { z: 25, lane: -0.25, speed: 10, type: 'same' }
  ];

  puddleGlints = [];
  for (let i = 0; i < 46; i++) {
    puddleGlints.push({ z: rand(2.2, 40), lane: rand(-0.92, 0.92), a: rand(0.04, 0.16), seed: rand(0, 100) });
  }
}

let rainFar = [], rainNear = [], drops = [], streaks = [];

function makeRain() {
  rainFar = []; rainNear = [];
  for (let i = 0; i < Math.round(W * 0.34); i++) rainFar.push({ x: rand(0, W), y: rand(0, H), len: rand(2.5, 6), v: rand(120, 210), a: rand(0.05, 0.15) });
  for (let i = 0; i < Math.round(W * 0.16); i++) rainNear.push({ x: rand(0, W), y: rand(0, H), len: rand(7, 15), v: rand(280, 430), a: rand(0.10, 0.28) });
  streaks = [];
  for (let i = 0; i < 9; i++) streaks.push({ x: rand(0, W), y: rand(L.wTop, L.wBottom), len: rand(20, 70), a: rand(0.02, 0.06), spd: rand(2, 9) });
}

function makeDrops() {
  drops = [];
  for (let i = 0; i < Math.round(W / 5.6); i++) {
    const d = {}; resetDrop(d, false);
    d.y = rand(L.wTop + 4, L.wBottom - 6);
    if (i < 9) { d.r = rand(2.6, 3.6); d.v = rand(1.2, 5); d.a = rand(0.45, 0.75); d.trail = rand(2, 7); }
    drops.push(d);
  }
}

function resetDrop(d, fromTop) {
  d.x = rand(L.pad + 12, W - L.pad - 12);
  d.y = fromTop ? rand(L.wTop - 14, L.wTop + 2) : rand(L.wTop, L.wBottom);
  d.r = rand(0.8, 3.2);
  d.v = rand(6, 30) * (0.35 + d.r * 0.35);
  d.a = rand(0.3, 0.7);
  d.trail = rand(0, 10);
  d.wob = rand(0, 6.28);
  d.slip = rand(0, 4);
}

let wiperPhase = 0;
let scrapeLevel = 0;

function update(dt) {
  S.t += dt; S.scroll += S.speed * dt;
  S.speedKmh = 82 + Math.sin(S.t * 0.23) * 6 + Math.sin(S.t * 1.7) * 1.2;

  for (const l of lights) { l.z -= S.speed * dt; if (l.z < 1.5) l.z += 26 * 7; }

  for (const c of cars) {
    if (c.type === 'oncoming') {
      c.z -= (S.speed + c.speed) * dt;
      if (c.z < 1.8) { c.z = 35; c.lane = rand(0.2, 0.5); }
    } else {
      c.z -= (S.speed - c.speed) * dt;
      if (c.z < 1.8) { c.z = 40; c.lane = rand(-0.5, -0.1); }
      else if (c.z > 50) c.z = 15;
    }
  }

  for (const r of rainFar) { r.y += r.v * dt; r.x += r.v * 0.16 * dt; if (r.y > H + 6) { r.y = -8; r.x = rand(-20, W + 10); } if (r.x > W + 6) r.x = -8; }
  for (const r of rainNear) { r.y += r.v * dt; r.x += r.v * 0.17 * dt; if (r.y > H + 12) { r.y = -14; r.x = rand(-30, W + 10); } if (r.x > W + 12) r.x = -12; }
  for (const s of streaks) { s.y += s.spd * dt; if (s.y > L.wBottom) { s.y = L.wTop; s.x = rand(0, W); } }
  for (let i = 0; i < drops.length; i++) {
    const d = drops[i]; d.slip += dt; d.y += d.v * dt * (0.7 + Math.sin(d.slip * 1.3 + d.wob) * 0.35);
    d.x += Math.sin(S.t * 1.7 + d.wob) * dt * 1.6; d.trail = Math.min(26, d.trail + d.v * dt * 1.6 + dt * 2);
    if (d.y > L.wBottom - 3 || d.x < L.pad + 6 || d.x > W - L.pad - 6) resetDrop(d, true);
  }
  updateWipers(dt);
}

function updateWipers(dt) {
  const mode = S.wiperMode; const prev = wiperPhase;
  if (mode > 0) {
    const period = mode === 2 ? 1.15 : 2.75;
    wiperPhase = (wiperPhase + dt / period) % 1;
    if (prev < 0.5 && wiperPhase >= 0.5) AudioEngine.thump(1);
    if (wiperPhase < prev) AudioEngine.thump(0.85);
  }
  const target = mode > 0 ? 0.5 - 0.5 * Math.cos(2 * Math.PI * wiperPhase) : 0;
  for (let i = 0; i < wipers.length; i++) {
    const w = wipers[i];
    const lagTarget = mode > 0 ? 0.5 - 0.5 * Math.cos(2 * Math.PI * ((wiperPhase + i * 0.045) % 1)) : 0;
    const tgt = i === 0 ? target : lagTarget;
    w.prevAngle = w.angle; w.pos += (tgt - w.pos) * Math.min(1, dt * (mode > 0 ? 26 : 7));
    w.angle = lerp(w.a0, w.a1, w.pos);
    if (mode > 0 && Math.abs(w.angle - w.prevAngle) > 0.0004) {
      for (let k = drops.length - 1; k >= 0; k--) {
        const d = drops[k]; const dx = d.x - w.px, dy = d.y - w.py;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > w.len * 1.04 || dist < w.len * 0.16) continue;
        const ang = Math.atan2(-dy, dx); let diff = ang - w.angle;
        while (diff > Math.PI) diff -= Math.PI * 2; while (diff < -Math.PI) diff += Math.PI * 2;
        if (Math.abs(diff) < 0.085) {
          drops.splice(k, 1);
          if (Math.random() < 0.5) { const nd = {}; resetDrop(nd, false); nd.x = d.x + rand(-3, 3); nd.y = Math.min(L.wBottom - 6, d.y + rand(2, 9)); nd.r = rand(0.5, 1.2); nd.trail = 1; drops.push(nd); }
        }
      }
    }
  }
  let vel = 0; if (mode > 0) { const w0 = wipers[0]; vel = clamp(Math.abs(w0.angle - w0.prevAngle) / Math.max(dt, 0.001) / 3.2, 0, 1); }
  scrapeLevel = lerp(scrapeLevel, vel, Math.min(1, dt * 12));
  AudioEngine.setScrape(scrapeLevel);
}

function drawSky() {
  const g = ctx.createLinearGradient(0, L.wTop - 4, 0, L.horizon);
  g.addColorStop(0, '#05070f'); g.addColorStop(0.5, '#0a1020'); g.addColorStop(1, '#1a2537');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, L.horizon + 2);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  radial(W * 0.58, L.horizon - 4, W * 0.46, '120,95,80', 0.16);
  radial(W * 0.18, L.horizon - 8, W * 0.2, '90,110,140', 0.08);
  ctx.restore();
  for (const c of clouds) {
    c.x += c.spd * 0.016; if (c.x > W + 80) c.x = -c.w - 40;
    ctx.fillStyle = 'rgba(38,50,72,' + c.a + ')';
    ctx.fillRect(Math.round(c.x), Math.round(c.y), Math.round(c.w), Math.round(c.h * 0.55));
    ctx.fillRect(Math.round(c.x + c.w * 0.12), Math.round(c.y - c.h * 0.35), Math.round(c.w * 0.7), Math.round(c.h * 0.5));
    ctx.fillRect(Math.round(c.x + c.w * 0.34), Math.round(c.y - c.h * 0.65), Math.round(c.w * 0.38), Math.round(c.h * 0.4));
  }
}

function drawJapaneseCityscape() {
  for (const b of japaneseBuildings) {
    b.x -= S.speed * 0.04;
    if (b.x + b.w < -10) {
      b.x = W + randi(10, 40);
    }
    const top = L.horizon - b.h;
    ctx.fillStyle = b.col;
    ctx.fillRect(Math.round(b.x), Math.round(top), b.w, b.h + 5);

    ctx.fillStyle = '#0f1722';
    ctx.fillRect(Math.round(b.x - 2), Math.round(top), b.w + 4, 3);
    ctx.fillRect(Math.round(b.x - 1), Math.round(top + b.h * 0.4), b.w + 2, 2);

    for (const s of b.signs) {
      const sx = s.side === 'left' ? b.x + 2 : b.x + b.w - 6;
      const sy = top + s.y;
      ctx.fillStyle = s.color;
      ctx.fillRect(Math.round(sx), Math.round(sy), 4, s.h);

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      radial(sx + 2, sy + s.h / 2, 14, s.color === '#ff2a6d' ? '255,42,109' : (s.color === '#05d9e8' ? '5,217,232' : '255,180,87'), 0.25);
      ctx.restore();
    }
  }

  ctx.fillStyle = '#070c12';
  for (let x = -8; x < W + 8; x += 5) {
    const h = 3 + Math.round(Math.abs(Math.sin(x * 0.37)) * 6);
    ctx.fillRect(x, L.horizon - h + 2, 5, h);
  }
}

function project(z) { const p = 1.6 / z; return { p, y: L.horizon + (L.yB - L.horizon) * p, hw: W * 0.8 * p }; }

function drawRoad() {
  const yH = L.horizon, yB = L.yB, cx = L.cx, hwN = W * 0.8;
  rect(0, yH, W, H - yH, '#06090d');
  ctx.beginPath(); ctx.moveTo(cx - 2, yH); ctx.lineTo(cx + 2, yH); ctx.lineTo(cx + hwN, yB + 20); ctx.lineTo(cx - hwN, yB + 20); ctx.closePath();
  const rg = ctx.createLinearGradient(0, yH, 0, yB); rg.addColorStop(0, '#121a26'); rg.addColorStop(0.2, '#0c121a'); rg.addColorStop(1, '#080b10');
  ctx.fillStyle = rg; ctx.fill();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const sh = ctx.createLinearGradient(0, yH, 0, yH + (yB - yH) * 0.5); sh.addColorStop(0, 'rgba(95,130,175,0.12)'); sh.addColorStop(1, 'rgba(95,130,175,0)');
  ctx.fillStyle = sh; ctx.fillRect(0, yH, W, (yB - yH) * 0.5);
  for (const g of puddleGlints) {
    if (g.z < 1.7) continue; const pr = project(g.z); if (pr.y > L.wBottom) continue;
    const flick = 0.55 + 0.45 * Math.sin(S.t * 1.6 + g.seed), x = cx + g.lane * pr.hw;
    ctx.fillStyle = 'rgba(170,205,240,' + (g.a * flick) + ')'; ctx.fillRect(Math.round(x), Math.round(pr.y), Math.max(1, Math.round(pr.p * 5)), 1);
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(175,195,215,0.13)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx - 3, yH); ctx.lineTo(cx - hwN * 0.995, yB + 14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 3, yH); ctx.lineTo(cx + hwN * 0.995, yB + 14); ctx.stroke();
  drawLaneDashes(yH, yB, cx, hwN, 0); drawReflectors(yH, yB, cx, hwN);
  const hg = ctx.createLinearGradient(0, L.horizon - 10, 0, L.horizon + 16);
  hg.addColorStop(0, 'rgba(120,150,190,0)'); hg.addColorStop(0.55, 'rgba(120,150,190,0.12)'); hg.addColorStop(1, 'rgba(120,150,190,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, L.horizon - 10, W, 26);
}

function drawLaneDashes(yH, yB, cx, hwN, laneOffset) {
  const P = 8, DASH = 3.4, zN = 2.6, zF = 95, base = S.scroll;
  for (let n = Math.ceil((base + zF) / P); n >= Math.floor((base + zN) / P); n--) {
    let zA = n * P - base, zB = zA + DASH; if (zB < zN || zA > zF) continue;
    zA = Math.max(zA, zN); zB = Math.min(zB, zF);
    const pA = zN / zA, pB = zN / zB, yA = yH + (yB - yH) * pA, yB2 = yH + (yB - yH) * pB;
    const wA = Math.max(1, Math.round(8 * pA)), wB = Math.max(1, Math.round(8 * pB));
    ctx.fillStyle = 'rgba(225,232,240,' + clamp((1 - zB / zF) * 0.62, 0.07, 0.46) + ')';
    ctx.beginPath(); ctx.moveTo(cx + laneOffset * hwN * pA - wA / 2, yA); ctx.lineTo(cx + laneOffset * hwN * pA + wA / 2, yA);
    ctx.lineTo(cx + laneOffset * hwN * pB + wB / 2, yB2); ctx.lineTo(cx + laneOffset * hwN * pB - wB / 2, yB2); ctx.closePath(); ctx.fill();
  }
}

function drawReflectors(yH, yB, cx, hwN) {
  const P = 6.5, zN = 1.6, zF = 34, base = S.scroll;
  for (let n = Math.floor((base + zN) / P); n <= Math.ceil((base + zF) / P); n++) {
    const z = n * P - base; if (z < zN || z > zF) continue; const pr = project(z); if (pr.y > L.wBottom) continue;
    const side = n % 2 === 0 ? -1 : 1, x = cx + side * pr.hw * 1.06, a = clamp(1.2 - z / zF, 0.1, 0.9);
    ctx.fillStyle = 'rgba(255,190,120,' + (a * 0.9) + ')'; ctx.fillRect(Math.round(x), Math.round(pr.y) - 1, 1, 1);
  }
}

function drawStreetlights() {
  for (const l of lights) {
    if (l.z < 1.55 || l.z > 90) continue; const pr = project(l.z); const p = pr.p; if (p < 0.018) continue;
    const x = L.cx + l.side * pr.hw * 1.34; if (x < -70 || x > W + 70) continue;
    const topY = pr.y - H * 0.7 * p, pw = Math.max(1, Math.round(3.6 * p));
    ctx.fillStyle = '#080d12'; ctx.fillRect(Math.round(x - pw / 2), Math.round(topY), pw, Math.round(H * 0.7 * p));
    const lx = x - l.side * Math.max(3, 46 * p), ly = topY + Math.max(1, Math.round(2 * p));
    ctx.fillStyle = '#ffe3b4'; ctx.fillRect(Math.round(lx - 4), Math.round(ly), Math.max(2, Math.round(8 * p)), Math.max(1, Math.round(2 * p)));
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    radial(lx, ly + 2, Math.max(8, 66 * p), '255,186,110', 0.50);
    ctx.restore();
  }
}

function drawTraffic() {
  for (const c of cars) {
    if (c.z < 1.4 || c.z > 45) continue;
    const pr = project(c.z);
    const p = pr.p;
    const x = L.cx + c.lane * pr.hw;
    const y = pr.y;
    if (y > L.wBottom + 10) continue;

    const cw = Math.max(2, 0.25 * W * 0.8 * p * 1.15);
    const chh = cw * 0.5;
    const left = x - cw / 2;
    const top = y - chh;

    ctx.fillStyle = 'rgba(12,16,24,0.95)';
    ctx.fillRect(Math.round(left), Math.round(top + chh * 0.3), Math.round(cw), Math.round(chh * 0.7));
    ctx.fillRect(Math.round(left + cw * 0.15), Math.round(top), Math.round(cw * 0.7), Math.round(chh * 0.4));

    const lw = Math.max(1, Math.round(cw * 0.15));
    const lh = Math.max(1, Math.round(chh * 0.2));
    const ly = top + chh * 0.45;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    if (c.type === 'oncoming') {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.round(left + cw * 0.08), Math.round(ly), lw, lh);
      ctx.fillRect(Math.round(left + cw * 0.77), Math.round(ly), lw, lh);
      radial(left + cw * 0.15, ly, Math.max(3, cw * 0.8), '255,255,255', 0.5);
      radial(left + cw * 0.85, ly, Math.max(3, cw * 0.8), '255,255,255', 0.5);
    } else {
      ctx.fillStyle = '#ff2211';
      ctx.fillRect(Math.round(left + cw * 0.08), Math.round(ly), lw, lh);
      ctx.fillRect(Math.round(left + cw * 0.77), Math.round(ly), lw, lh);
      radial(left + cw * 0.15, ly, Math.max(3, cw * 0.6), '255,30,20', 0.3);
      radial(left + cw * 0.85, ly, Math.max(3, cw * 0.6), '255,30,20', 0.3);
    }
    ctx.restore();
  }
}

function drawRainFall() {
  ctx.lineWidth = 1;
  for (const r of rainFar) {
    if (r.y < L.wTop - 6 || r.y > L.wBottom + 4) continue;
    ctx.strokeStyle = 'rgba(155,185,215,' + r.a + ')'; ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x + r.len * 0.28, r.y + r.len); ctx.stroke();
  }
  for (const r of rainNear) {
    if (r.y < L.wTop - 10 || r.y > L.wBottom + 6) continue;
    ctx.strokeStyle = 'rgba(185,215,240,' + r.a + ')'; ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x + r.len * 0.30, r.y + r.len); ctx.stroke();
  }
}

function drawStreaks() {
  for (const s of streaks) { ctx.fillStyle = 'rgba(175,205,235,' + s.a + ')'; ctx.fillRect(Math.round(s.x), Math.round(Math.max(L.wTop, s.y - s.len)), 1, Math.round(s.len)); }
}

function drawGlassDrops() {
  for (const d of drops) {
    const x = Math.round(d.x), y = Math.round(d.y);
    if (d.trail > 2) {
      const ty = Math.max(L.wTop, y - d.trail);
      ctx.fillStyle = 'rgba(165,200,230,' + (d.a * 0.45) + ')'; ctx.fillRect(x, ty, 1, Math.max(1, y - ty));
    }
    ctx.fillStyle = 'rgba(190,225,250,' + (d.a * 0.75) + ')'; ctx.fillRect(x, y, 1, 1);
  }
}

function drawGlassHaze() {
  const g = ctx.createLinearGradient(0, L.wBottom - H * 0.20, 0, L.wBottom);
  g.addColorStop(0, 'rgba(255,150,60,0)'); g.addColorStop(1, 'rgba(255,150,60,0.10)');
  ctx.fillStyle = g; ctx.fillRect(0, L.wBottom - H * 0.20, W, H * 0.20);
  ctx.fillStyle = 'rgba(30,50,72,0.10)'; ctx.fillRect(0, L.wTop, W, L.wBottom - L.wTop);
}

function drawWipers() {
  for (const w of wipers) {
    const cos = Math.cos(w.angle), sin = Math.sin(w.angle), tipx = w.px + cos * w.len, tipy = w.py - sin * w.len;
    if (S.wiperMode > 0) {
      const delta = Math.abs(w.angle - w.prevAngle);
      if (delta > 0.001 && delta < 0.3) {
        ctx.beginPath(); ctx.moveTo(w.px, w.py); ctx.arc(w.px, w.py, w.len, -w.prevAngle, -w.angle, w.angle > w.prevAngle); ctx.closePath();
        ctx.fillStyle = 'rgba(175,205,235,0.018)'; ctx.fill();
      }
    }
    ctx.strokeStyle = '#0c1116'; ctx.lineWidth = Math.max(3, Math.round(H * 0.024));
    ctx.beginPath(); ctx.moveTo(w.px, w.py); ctx.lineTo(w.px + cos * w.len * 0.62, w.py - sin * w.len * 0.62); ctx.stroke();
    ctx.strokeStyle = '#1a222b'; ctx.lineWidth = Math.max(4, Math.round(H * 0.032));
    ctx.beginPath(); ctx.moveTo(w.px + cos * w.len * 0.30, w.py - sin * w.len * 0.30); ctx.lineTo(tipx, tipy); ctx.stroke();
    pixCircle(tipx, tipy, 1, '#2c3742'); pixCircle(w.px, w.py, 2, '#0b1015');
  }
}

function drawDashboard() {
  const d = L.dashTop;
  ctx.beginPath(); ctx.moveTo(-2, H + 2); ctx.lineTo(-2, d + 17);
  ctx.bezierCurveTo(W * 0.10, d + 3, W * 0.26, d - 2, W * 0.42, d + 5);
  ctx.bezierCurveTo(W * 0.56, d + 11, W * 0.66, d - 3, W * 0.80, d + 4);
  ctx.bezierCurveTo(W * 0.90, d + 8, W * 0.96, d + 12, W + 2, d + 16); ctx.lineTo(W + 2, H + 2); ctx.closePath();
  const g = ctx.createLinearGradient(0, d, 0, H); g.addColorStop(0, '#11171f'); g.addColorStop(1, '#040608');
  ctx.fillStyle = g; ctx.fill();
}

function drawCluster() {
  const cy = Math.round(H * 0.785), cx1 = Math.round(W * 0.185);
  ctx.fillStyle = '#06090c';
  ctx.beginPath(); ctx.ellipse(W * 0.25, cy + Math.round(H * 0.02), W * 0.20, H * 0.13, 0, Math.PI, Math.PI * 2); ctx.fill();
  pixCircle(cx1, cy, Math.round(H * 0.072), '#121a21');
  const sp = String(Math.round(S.speedKmh)).padStart(3, ' ');
  pixText(sp, cx1 - 5, cy + Math.round(H * 0.035), 1, 'rgba(255,180,100,0.75)');
}

function drawWheel() {
  const cx = W * 0.225, cy = H * 1.035, rx = W * 0.185, ry = H * 0.245, thick = Math.max(8, Math.round(H * 0.042));
  ellipseRing(cx, cy, rx, ry, thick, '#0b0e13');
}

function drawCabin() {
  drawDashboard(); drawCluster(); drawWheel();
  poly([[0, -2], [L.pad + 14, L.wTop - 2], [L.pad - 2, L.wBottom + 4], [0, H + 2]], '#070a0d');
  poly([[W, -2], [W - L.pad - 14, L.wTop - 2], [W - L.pad + 2, L.wBottom + 4], [W, H + 2]], '#070a0d');
}

function drawScene() {
  ctx.save(); windshieldPath(); ctx.clip();
  drawSky(); 
  drawJapaneseCityscape();
  drawRoad(); drawStreetlights(); drawTraffic();
  drawStreaks(); drawRainFall(); drawGlassDrops(); drawWipers(); drawGlassHaze();
  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const jx = Math.sin(S.t * 6.7) + Math.sin(S.t * 3.1), jy = Math.sin(S.t * 5.3) + Math.cos(S.t * 2.3);
  ctx.save(); ctx.translate(jx > 1.4 ? 1 : jx < -1.4 ? -1 : 0, jy > 1.5 ? 1 : jy < -1.5 ? -1 : 0);
  drawScene(); drawCabin(); ctx.restore();
}

let lastT = 0;
function loop(now) {
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000; lastT = now; dt = Math.min(dt, 0.05);
  update(dt); draw();
  requestAnimationFrame(loop);
}

/* ============================ audio ============================ */
const AudioEngine = (function () {
  let ctx = null, master = null, rainBus = null, sfxBus = null;
  let whiteBuf = null, pinkBuf = null, shortBuf = null, scrapeGain = null, started = false;

  function noise(seconds, pink) {
    const len = Math.max(1, Math.floor(ctx.sampleRate * seconds));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    if (pink) {
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
      }
    } else {
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    return buf;
  }

  function init() {
    if (started) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC(); } catch (e) { return false; }
    master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
    rainBus = ctx.createGain(); rainBus.gain.value = 0.55; rainBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
    whiteBuf = noise(4, false); pinkBuf = noise(4.5, true); shortBuf = noise(0.35, false);

    const s1 = ctx.createBufferSource(); s1.buffer = pinkBuf; s1.loop = true; s1.start();
    const lp = ctx.createBiquadFilter(); lp.frequency.value = 420; s1.connect(lp).connect(rainBus);

    const s4 = ctx.createBufferSource(); s4.buffer = whiteBuf; s4.loop = true; s4.start();
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 950;
    scrapeGain = ctx.createGain(); scrapeGain.gain.value = 0;
    s4.connect(bp).connect(scrapeGain).connect(sfxBus);

    if (ctx.state === 'suspended') ctx.resume();
    started = true; return true;
  }

  return {
    init,
    thump(s) {
      if (!started || !ctx || ctx.state !== 'running') return;
      const t = ctx.currentTime, o = ctx.createOscillator();
      o.frequency.setValueAtTime(58, t); o.frequency.exponentialRampToValueAtTime(37, t + 0.16);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.26 * s, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
      o.connect(g).connect(sfxBus); o.start(t); o.stop(t + 0.27);
    },
    setScrape(v) { if (started && scrapeGain) scrapeGain.gain.setTargetAtTime(clamp(v, 0, 1) * 0.06, ctx.currentTime, 0.06); },
    setRain(v) { if (started && rainBus) rainBus.gain.setTargetAtTime(Math.pow(clamp(v, 0, 1), 1.25) * 0.95, ctx.currentTime, 0.18); },
    resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
  };
})();

/* ============================ UI & Tab Switching ============================ */
const wiperButtons = Array.from(document.querySelectorAll('.segbtn'));

function setWiperMode(mode) {
  S.wiperMode = mode;
  wiperButtons.forEach(b => {
    const on = Number(b.dataset.mode) === mode;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', String(on));
  });
}

wiperButtons.forEach(b => b.addEventListener('click', () => setWiperMode(Number(b.dataset.mode))));
setWiperMode(1);

document.getElementById('rainVol').addEventListener('input', e => {
  S.rain = Number(e.target.value) / 100;
  AudioEngine.setRain(S.rain);
});

const tabLocal = document.getElementById('tabLocal');
const tabSpotify = document.getElementById('tabSpotify');
const viewLocal = document.getElementById('viewLocal');
const viewSpotify = document.getElementById('viewSpotify');

tabLocal.addEventListener('click', () => {
  tabLocal.classList.add('active'); tabSpotify.classList.remove('active');
  viewLocal.hidden = false; viewSpotify.hidden = true;
});

tabSpotify.addEventListener('click', () => {
  tabSpotify.classList.add('active'); tabLocal.classList.remove('active');
  viewSpotify.hidden = false; viewLocal.hidden = true;
});

/* Local Player Integration logic */
let localAudio = new Audio();
let trackIndex = 0;
let currentList = [];

function setMarquee(text) {
  const t = ' ' + text + '   +   ';
  document.getElementById('m1').textContent = t;
  document.getElementById('m2').textContent = t;
}

document.getElementById('loadBtn').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', e => {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  currentList = files.map(f => ({ name: f.name.replace(/\.[^.]+$/, ''), url: URL.createObjectURL(f) }));
  trackIndex = 0;
  playLocalTrack(0);
});

function playLocalTrack(idx) {
  if (!currentList.length) return;
  trackIndex = (idx + currentList.length) % currentList.length;
  const tr = currentList[trackIndex];
  localAudio.src = tr.url;
  localAudio.play().catch(() => {});
  document.getElementById('badge').textContent = 'LOCAL';
}

document.getElementById('playBtn').addEventListener('click', () => {
  if (!localAudio.src && currentList.length) { playLocalTrack(0); return; }
  if (localAudio.paused) { localAudio.play().catch(() => {}); }
  else { localAudio.pause(); }
});

document.getElementById('nextBtn').addEventListener('click', () => playLocalTrack(trackIndex + 1));
document.getElementById('prevBtn').addEventListener('click', () => playLocalTrack(trackIndex - 1));

document.getElementById('musicVol').addEventListener('input', e => {
  localAudio.volume = Number(e.target.value) / 100;
});

localAudio.addEventListener('ended', () => playLocalTrack(trackIndex + 1));

document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'BUTTON' || tag === 'TEXTAREA') return;
  if (!document.body.classList.contains('started')) return;
  if (e.code === 'Space') { e.preventDefault(); if (localAudio.paused) localAudio.play(); else localAudio.pause(); }
  else if (e.key === 'n' || e.key === 'N') playLocalTrack(trackIndex + 1);
  else if (e.key === 'p' || e.key === 'P') playLocalTrack(trackIndex - 1);
  else if (e.key === 'w' || e.key === 'W') setWiperMode((S.wiperMode + 1) % 3);
});

/* Fix for Ignite Engine Click Listener Binding */
function startEverything() {
  if (document.body.classList.contains('started')) return;
  document.body.classList.add('started');
  document.getElementById('intro').classList.add('hide');
  try { AudioEngine.init(); } catch (err) {}
  AudioEngine.resume();
  AudioEngine.setRain(S.rain);
}
document.getElementById('startBtn').addEventListener('click', startEverything);

function onResize() {
  const vw = Math.max(320, window.innerWidth);
  const vh = Math.max(240, window.innerHeight);
  const aspect = clamp(vw / vh, 1.35, 2.15);
  W = 480; H = Math.round(W / aspect);
  canvas.width = W; canvas.height = H;
  ctx.imageSmoothingEnabled = false;
  layout(); seedScene(); makeRain(); makeDrops();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

onResize();
requestAnimationFrame(loop);
</script>
